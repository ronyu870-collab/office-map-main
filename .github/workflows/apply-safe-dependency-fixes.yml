name: One-time safe dependency fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'security/p0-dependency-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: security/p0-dependency-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove unused Puppeteer and legacy vm2 proxy chain
        run: |
          npm pkg set 'overrides.ali-oss.urllib=2.41.0'
          npm uninstall puppeteer-core
          npm install

      - name: Apply non-breaking npm audit fixes
        shell: bash
        run: |
          set +e
          npm audit fix
          audit_status=$?
          set -e
          echo "npm audit fix exited with ${audit_status} after applying available non-breaking fixes"

      - name: Show remaining audit baseline
        shell: bash
        run: |
          set +e
          npm audit
          exit 0

      - name: Commit dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "security: remove unused Puppeteer and critical vm2 chain"
          git pull --rebase origin security/p0-dependency-audit
          git push origin HEAD:security/p0-dependency-audit
