name: Fix Intelligence shortlist action layout

on:
  push:
    branches:
      - fix/intelligence-shortlist-actions
    paths:
      - .github/workflows/fix-intelligence-shortlist-actions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/intelligence-shortlist-actions
          fetch-depth: 0
      - name: Remove floating shortlist action bar
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/intelligence/IntelligenceRecommendationWorkspace.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '      <main className="h-full overflow-y-auto overscroll-contain pb-24">': '      <main className="h-full overflow-y-auto overscroll-contain pb-8">',
              '          <div className="sticky bottom-0 z-20 border-t border-slate-200 bg-white/95 px-4 py-3 shadow-[0_-8px_24px_rgb(15_23_42_/_0.06)] backdrop-blur sm:px-6">': '          <div className="mx-auto mt-5 w-full max-w-[1180px] px-4 pb-6 sm:px-6 lg:px-8">',
              '            <div className="mx-auto flex w-full max-w-[1180px] flex-wrap items-center justify-between gap-3">': '            <div className="flex flex-wrap items-center justify-between gap-3 rounded-[var(--cd-radius-lg)] border border-slate-200 bg-white px-4 py-3 sm:px-5">',
              '                <div className="mt-0.5 text-[11px] text-slate-400">AI 先推荐，Broker 审核后再进入地图或输出客户方案。</div>': '                <div className="mt-0.5 text-[11px] text-slate-400">AI 已预选 Top 5；调整完成后，可核验空间位置或生成客户方案。</div>',
              '                  <FileChartColumn size={13} aria-hidden="true" /> 生成已选 {selectedIds.length} 个项目方案': '                  <FileChartColumn size={13} aria-hidden="true" /> 生成方案（{selectedIds.length}个）',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-intelligence-shortlist-actions.yml').unlink()
      - name: Commit UI fix
        run: |
          git config user.name "ronyu870-collab"
          git config user.email "ronyu870@gmail.com"
          git add src/components/intelligence/IntelligenceRecommendationWorkspace.tsx .github/workflows/fix-intelligence-shortlist-actions.yml
          git commit -m "fix: keep Intelligence shortlist actions in document flow"
          git push origin HEAD:fix/intelligence-shortlist-actions
