name: Home Maintainability Verify

on:
  push:
    branches:
      - fix/home-visual-rebuild-zh

permissions:
  contents: write

concurrency:
  group: home-maintainability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/home-visual-rebuild-zh
          fetch-depth: 0

      - name: Prepare final tree
        run: python3 scripts/finalize_home_maintainability.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Production Build
        run: npm run build

      - name: Commit verified final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record Home maintainability hardening"
          git push origin HEAD:fix/home-visual-rebuild-zh
