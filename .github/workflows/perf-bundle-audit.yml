name: Temporary performance bundle audit

on:
  push:
    branches:
      - perf/data-2-performance-hardening

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect production chunks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = '.next/static/chunks';
          const files = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const name of fs.readdirSync(dir)) {
              const full = path.join(dir, name);
              const stat = fs.statSync(full);
              if (stat.isDirectory()) walk(full);
              else if (name.endsWith('.js')) files.push({ full, bytes: stat.size });
            }
          }
          walk(root);
          files.sort((a,b) => b.bytes - a.bytes);
          console.log('[bundle-audit] largest chunks');
          for (const f of files.slice(0, 20)) console.log(`${f.bytes}\t${f.full}`);
          const probes = ['echarts','buildingmetricseditmodal','xlsx','jszip','ali-oss','react-md-editor','inittrendchart'];
          for (const probe of probes) {
            const matches = [];
            for (const f of files) {
              const text = fs.readFileSync(f.full, 'utf8').toLowerCase();
              if (text.includes(probe)) matches.push(`${f.bytes}:${f.full}`);
            }
            console.log(`[bundle-audit] ${probe}: ${matches.length ? matches.join(', ') : 'not found in emitted chunk text'}`);
          }
          const manifest = '.next/react-loadable-manifest.json';
          if (fs.existsSync(manifest)) {
            const data = JSON.parse(fs.readFileSync(manifest, 'utf8'));
            for (const [key,value] of Object.entries(data)) {
              if (/map|BuildingMetricsEditModal|FloatingBuildingList/i.test(key)) {
                console.log(`[bundle-audit] loadable ${key}: ${JSON.stringify(value)}`);
              }
            }
          }
          NODE
