name: One-time Map architecture codemod

on:
  push:
    branches:
      - refactor/map-architecture

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[map-architecture-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/map-architecture
          fetch-depth: 0

      - name: Apply architecture codemod
        run: python3 scripts/apply-map-architecture.py

      - name: Commit generated refactor
        run: |
          if git diff --quiet -- src/app/map/MapClient.tsx src/app/map/model/MapDataStore.ts; then
            echo "No codemod changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/map/MapClient.tsx src/app/map/model/MapDataStore.ts
          git commit -m "[map-architecture-codemod] refactor: wire map domain store into client"
          git push origin HEAD:refactor/map-architecture
