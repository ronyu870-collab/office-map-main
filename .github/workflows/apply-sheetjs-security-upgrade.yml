name: One-time SheetJS security upgrade

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.pull_request.head.ref == 'security/p0-dependency-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: security/p0-dependency-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin patched SheetJS distribution
        run: npm install --save-exact https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz

      - name: Commit dependency lock update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "security: upgrade SheetJS to 0.20.3"
          git push origin HEAD:security/p0-dependency-audit
