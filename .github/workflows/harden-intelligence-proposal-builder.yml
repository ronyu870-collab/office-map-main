name: Harden Intelligence proposal builder

on:
  push:
    branches:
      - feature/intelligence-proposal-builder

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intelligence-proposal-builder
          fetch-depth: 0
      - name: Patch workspace lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/intelligence/ProposalWorkspace.tsx')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'anchor missing: {old[:140]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "  const [draft, setDraft] = React.useState<ProposalDraft | null>(null);\n  const [clientName, setClientName] = React.useState('');\n",
              "  const [draft, setDraft] = React.useState<ProposalDraft | null>(null);\n  const [draftReady, setDraftReady] = React.useState(false);\n  const [clientName, setClientName] = React.useState('');\n",
          )
          replace_once(
              "      setDraft(next);\n      setClientName(next?.clientName || '');\n",
              "      setDraft(next);\n      setClientName(next?.clientName || '');\n      setDraftReady(true);\n",
          )
          replace_once(
              "  }, [idsKey, previewEnabled]);\n\n  if (status === 'loading' || !session) {\n",
              "  }, [draft, idsKey, previewEnabled]);\n\n  if (status === 'loading' || !session || !draftReady) {\n",
          )
          replace_once(
              "            <div className=\"text-right text-[11px] text-slate-400\">{new Date().toLocaleDateString('zh-CN')}</div>\n",
              "            <div suppressHydrationWarning className=\"text-right text-[11px] text-slate-400\">{new Date().toLocaleDateString('zh-CN')}</div>\n",
          )
          replace_once(
              "                onBlur={() => setDraft(setProposalClientName(clientName))}\n",
              "                onBlur={() => { const next = setProposalClientName(clientName); if (next) setDraft(next); }}\n",
          )

          p.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/harden-intelligence-proposal-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/intelligence/ProposalWorkspace.tsx
          git commit -m "fix: harden proposal workspace lifecycle"
          git push origin feature/intelligence-proposal-builder
