name: One-time Map runtime codemod

on:
  push:
    branches:
      - refactor/map-architecture

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[map-runtime-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/map-architecture
          fetch-depth: 0

      - name: Apply runtime codemod
        run: python3 scripts/apply-map-runtime.py

      - name: Commit generated refactor
        run: |
          if git diff --quiet -- src/app/map/MapClient.tsx; then
            echo "No runtime codemod changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/map/MapClient.tsx
          git commit -m "[map-runtime-codemod] refactor: use shared session and map runtime"
          git push origin HEAD:refactor/map-architecture
