name: Finalize Home QA changelog once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: home-qa-finalize-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Record final real-browser QA and remove this one-shot workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text()
          marker = '### Final browser QA acceptance'
          if marker not in s:
              anchor = '### Follow-up\n\n- Keep future Home changes focused on observed workflow friction; do not reintroduce decorative English labels, badge-driven hierarchy, or marketing-style hero treatment.\n'
              addition = '''### Final browser QA acceptance\n\n- Ran the Home against a deterministic production build with real Chromium at 1366×768, 1440×900, 1920×1080, 390×844, 430×932, plus 1024×768 and 1280×720.\n- Exercised loaded/session-transition states, empty/one/many/error notices, empty/populated/error market communication, long names, long announcements/messages/unbroken URLs, viewer-denied workspace access, normal/admin/demo user menus, notice expansion, mobile scrolling, full-screen communication, Escape handling, and 100dvh behavior.\n- Fixed one browser-observed interaction defect: generic module accessibility props were overriding the System Administration entry's `role=menuitem`, causing menu keyboard navigation to skip that entry for admin/demo states. The menu now preserves menuitem semantics while retaining its existing disabled/accessibility metadata.\n- No Home information architecture, database/RLS behavior, Map/Data Entry/Admin business logic, or speculative visual modules were added.\n- Observed proportions were retained: 54px header, current desktop gutters/rail widths, 1240px base container with the existing 1360px 2xl expansion, 104px Map entry, and current mobile single-column rhythm.\n\n'''
              if anchor not in s:
                  raise SystemExit('Expected Home changelog anchor not found; refusing unsafe edit')
              s = s.replace(anchor, addition + anchor, 1)
              p.write_text(s)
          PY
          rm -f .github/workflows/home-qa-finalize-once.yml
          if git diff --quiet; then
            echo 'Nothing to finalize.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/home-qa-finalize-once.yml
          git commit -m 'docs: record final Home browser QA'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
