name: One-time Map 2.0 import fix

on:
  push:
    branches:
      - feat/map-2-workbench

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[map-2-import-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/map-2-workbench
          fetch-depth: 0
      - name: Restore district fallback import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/map/MapClient.tsx')
          text = path.read_text()
          old = "import {\n  buildActiveFilterChips,"
          new = "import {\n  MAP_DISTRICTS as MOCK_DISTRICTS,\n  buildActiveFilterChips,"
          if old not in text:
              raise SystemExit('MapClient domain import target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- src/app/map/MapClient.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/map/MapClient.tsx
          git commit -m "[map-2-import-fix] fix: preserve district boundary fallback"
          git push origin HEAD:feat/map-2-workbench
