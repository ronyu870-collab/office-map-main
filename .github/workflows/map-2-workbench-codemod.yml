name: One-time Map 2.0 workbench view migration

on:
  push:
    branches:
      - feat/map-2-workbench

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[map-2-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/map-2-workbench
          fetch-depth: 0

      - name: Apply Map 2.0 view codemod
        run: python3 scripts/apply-map-2-workbench-view.py

      - name: Commit migrated view
        run: |
          if git diff --quiet -- src/app/map/MapClient.tsx src/components/SidebarFilter.tsx; then
            echo "No Map 2.0 codemod changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/map/MapClient.tsx src/components/SidebarFilter.tsx
          git commit -m "[map-2-codemod] feat: wire Map 2.0 workbench view"
          git push origin HEAD:feat/map-2-workbench
