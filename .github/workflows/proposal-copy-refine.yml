name: Proposal Copy Refinement

on:
  push:
    branches: [refine/intelligence-workspace-copy]
    paths: [.github/workflows/proposal-copy-refine.yml]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/intelligence-workspace-copy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refine Proposal product copy and contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/intelligence/ProposalWorkspace.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
            '请先从 Intelligence 输入客户需求，让 AI 生成真实项目 shortlist，再选择 1–5 个候选项目生成方案。': '请先从业务智能输入客户需求，让系统生成真实候选项目，再选择 1–5 个项目生成方案。',
            '返回 Intelligence <ArrowRight': '返回业务智能 <ArrowRight',
            'title="客户方案 Proposal"': 'title="客户方案"',
            '当前账号未开放 Intelligence Preview。': '当前账号未开放业务智能试用功能。',
            'status={<Badge tone="brand">AI Shortlist</Badge>}': 'status={<Badge tone="brand">候选方案</Badge>}',
            '<ArrowLeft size={13} aria-hidden="true" /> 返回 Intelligence': '<ArrowLeft size={13} aria-hidden="true" /> 返回业务智能',
            'AI 先生成 shortlist，Broker 审核候选和顺序后输出。匹配分只使用现有可验证字段，不使用实时销控猜测。': '系统先生成候选项目，业务人员审核候选和顺序后输出。匹配评分只使用现有可验证字段；未接入的实时销控信息不会参与自动判断。',
            'Intelligence Pilot · 数据来自当前内部平台': '业务智能试用版 · 数据来自当前内部平台',
            '>CLIENT<': '>客户<',
            '>Client Requirement<': '>客户需求<',
            '当前方案没有候选项目，请返回 Intelligence 从推荐结果中选择楼宇。': '当前方案没有候选项目，请返回业务智能从推荐结果中选择楼宇。',
            '>数据覆盖<': '>数据完整度<',
            '本方案为 Intelligence Pilot 输出。租金、空置率等市场指标以系统最新季度数据为准；当前尚未接入正式实时销控与可入住日期，因此不对具体可租单元、面积或入住时间作事实承诺。最终对客版本应由 Broker 人工确认。': '本方案由业务智能试用版生成。租金、空置率等市场指标以系统最新季度数据为准；当前尚未接入正式实时销控与可入住日期，因此不对具体可租单元、面积或入住时间作事实承诺。最终对客版本应由业务人员人工确认。',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected Proposal snippet: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          test_path = Path('src/components/intelligence/__tests__/proposal-builder-contract.test.ts')
          test = test_path.read_text(encoding='utf-8')
          test_replacements = {
            "it('scores only the requirement conditions that actually entered the Map handoff', () => {": "it('scores only requirement conditions explicitly eligible for proposal evaluation', () => {",
            "expect(workspace).toContain('只有已经实际应用到地图的绿色条件参与匹配分');": "expect(workspace).toContain('绿色条件参与规则评估；黄色或灰色条件只保留为人工核验事项');",
            "expect(scoring).toContain(\"WEIGHTS = { location: 35, rent: 45, grade: 20 }\");": "expect(scoring).toContain(\"WEIGHTS = { location: 25, rent: 35, grade: 20, metro: 15, green: 5 }\");",
          }
          for old, new in test_replacements.items():
              if old not in test:
                  raise SystemExit(f'Missing expected test snippet: {old}')
              test = test.replace(old, new, 1)
          test = test.replace(
              "expect(workspace).toContain('new Set(draft.requirement.appliedCapabilities)');\n    expect(workspace).toContain('scoringCapabilities');",
              "expect(workspace).toContain('new Set(draft.requirement.appliedCapabilities)');\n    expect(workspace).toContain('new Set(draft.requirement.evaluationCapabilities)');\n    expect(workspace).toContain('scoringCapabilities');",
              1,
          )
          test = test.replace(
              "expect(workspace).toContain('市场指标，不等于实时销控');",
              "expect(workspace).toContain('市场指标，不等于实时销控');\n    expect(workspace).toContain('数据完整度');\n    expect(workspace).not.toContain('AI Shortlist');\n    expect(workspace).not.toContain('Broker');\n    expect(workspace).not.toContain('Client Requirement');",
              1,
          )
          test_path.write_text(test, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text(encoding='utf-8')
          old = '- Replaced `数据覆盖` with `数据完整度` and reduced mixed Chinese/English copy in the visible workflow.\n'
          addition = '- Applied the same product-language cleanup to Proposal: prototype-style `shortlist` / `Broker` / provider labels are replaced by business-facing Chinese copy while scoring, draft state, Map handoff, permissions, and database behavior remain unchanged.\n'
          if addition not in current:
              if old not in current:
                  raise SystemExit('Missing changelog refinement insertion point')
              current = current.replace(old, old + addition, 1)
          changelog.write_text(current, encoding='utf-8')
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Focused Intelligence tests
        run: npx vitest run src/components/intelligence/__tests__
      - name: Production build
        run: npm run build
      - name: Commit verified Proposal refinement
        run: |
          rm .github/workflows/proposal-copy-refine.yml
          git config user.name "ronyu870-collab"
          git config user.email "ronyu870@gmail.com"
          git add src/components/intelligence/ProposalWorkspace.tsx src/components/intelligence/__tests__/proposal-builder-contract.test.ts CHANGELOG.md .github/workflows/proposal-copy-refine.yml
          git commit -m "refactor: polish Intelligence proposal copy"
          git push origin HEAD:refine/intelligence-workspace-copy
