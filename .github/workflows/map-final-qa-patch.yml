name: Temporary Map final QA patch

on:
  push:
    branches:
      - qa/map-final-experience

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/map-final-experience
          fetch-depth: 0
      - name: Apply final Map experience patch
        run: python3 scripts/map-final-qa-patch.py
      - name: Remove temporary tooling and commit product changes
        run: |
          rm -f scripts/map-final-qa-patch.py .github/workflows/map-final-qa-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden final Map workbench experience"
          git push origin HEAD:qa/map-final-experience
