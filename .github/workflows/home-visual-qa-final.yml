name: Home Visual QA Final

on:
  push:
    branches: [fix/home-visual-rebuild-zh]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: home-visual-qa-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reuse deterministic runtime QA harness
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          data=yaml.safe_load(Path('.github/workflows/home-visual-qa-v2.yml').read_text())
          steps=data['jobs']['browser-qa']['steps']
          wanted=['Build runtime-only QA harness','Start Next dev server','Write Playwright spec']
          for i,name in enumerate(wanted):
              step=next(s for s in steps if s.get('name')==name)
              Path(f'/tmp/final-qa-step-{i}.sh').write_text('set -euo pipefail\n'+step['run'])
          PY
          bash /tmp/final-qa-step-0.sh

          cat > src/app/qa-home/page.tsx <<'EOF'
          'use client';
          import * as React from 'react';
          import {HomeWorkspace} from '@/src/components/home/HomeWorkspace';
          export default function Page(){
            const [mounted,setMounted]=React.useState(false);
            React.useEffect(()=>setMounted(true),[]);
            if(!mounted) return null;
            return <HomeWorkspace/>;
          }
          EOF

      - name: Start Next dev server
        run: bash /tmp/final-qa-step-1.sh
      - name: Install Playwright locally
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Write and harden final QA spec
        shell: bash
        run: |
          bash /tmp/final-qa-step-2.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/home-visual-qa/home.spec.js')
          s=p.read_text()
          s=s.replace('waitForTimeout(250)', 'waitForTimeout(900)')
          s=s.replace('waitForTimeout(200)', 'waitForTimeout(900)')
          s=s.replace('waitForTimeout(100)', 'waitForTimeout(120)')
          s=s.replace('waitForTimeout(650)', 'waitForTimeout(950)')
          s += '''\n
test('mobile long notice and natural inner scrolling',async({page})=>{
  await page.setViewportSize({width:390,height:844});
  await page.goto(`${base}?role=editor&notice=long&comm=some`);
  await page.waitForTimeout(900);
  expect(await page.evaluate(()=>document.documentElement.scrollWidth)).toBeLessThanOrEqual(390);
  const scroller=page.locator('div.h-full.overflow-y-auto.overscroll-contain');
  await scroller.evaluate(el=>{el.scrollTop=el.scrollHeight});
  await page.waitForTimeout(150);
  await expect(page.getByRole('heading',{name:'团队动态'})).toBeVisible();
  await page.screenshot({path:path.join(out,'mobile-long-notice-scrolled.png')});
});

test('loaded wide-screen proportions',async({page})=>{
  await page.setViewportSize({width:1920,height:1080});
  await page.goto(`${base}?role=editor&notice=one&comm=some`);
  await page.waitForTimeout(900);
  const m=await measure(page,'1920-final-loaded');
  expect(m.map.width).toBeGreaterThan(900);
  expect(m.scrollWidth).toBeLessThanOrEqual(1920);
  await page.screenshot({path:path.join(out,'final-1920-loaded.png'),fullPage:true});
});
'''
          p.write_text(s)
          PY
      - name: Run final real Chromium QA
        run: npx playwright test tests/home-visual-qa/home.spec.js --reporter=line --workers=1
      - name: Save server log
        if: always()
        run: |
          mkdir -p home-visual-qa-artifacts
          cp /tmp/home-qa-next.log home-visual-qa-artifacts/next.log || true
      - name: Upload final QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-visual-qa-final
          path: home-visual-qa-artifacts
          if-no-files-found: warn
