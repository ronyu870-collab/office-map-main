name: Record Home visual rebuild once

on:
  push:
    branches:
      - fix/home-visual-rebuild-zh

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-visual-rebuild-zh
          fetch-depth: 0
      - name: Update changelog and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## 2026-08-25 — Home visual hierarchy rebuild'
          if marker not in text:
              anchor = '\n---\n\n'
              entry = '''## 2026-08-25 — Home visual hierarchy rebuild

### Area
Home / information architecture / responsive workspace entry / Chinese product language

### What changed

- Rebuilt Home around a restrained internal-workspace hierarchy instead of the previous enterprise-marketing treatment.
- Removed English eyebrows, English module titles, marketing labels, Map metric badges, oversized CTA treatment, and redundant brand copy from the visible Home UI.
- Standardized visible Home product language to Chinese while retaining the Colliers brand logo.
- Reduced the content width and right-rail weight, kept Map clearly first without a hero banner, and replaced secondary workspace cards with one consistent divider-based workspace list.
- Simplified Communication Board and Notice presentation so collaboration information remains functional but visually secondary to Map and data-entry work.
- Aligned the Home loading shell with the loaded layout to reduce perceived layout shift.
- Added presentation-contract regression coverage for Chinese labels and the existing session, authorization, audit, route, Communication, and Notice seams.

### Why

The prior Home 2.0 combined tiny uppercase labels, mixed Chinese and English, badges, nested cards, a visually heavy Map hero, and a high-contrast collaboration rail. Those rules fragmented the hierarchy and made the page feel assembled from enterprise UI motifs rather than designed as one stable internal data workspace.

### Impact

- Map remains the primary Home entry; Quarterly Update, Lease Submission, Research Library, and Administration retain their existing routes and access rules.
- Shared Session Context, authentication boundaries, role restrictions, demo mode, restricted-admin handling, ENTER_MODULE / LOGOUT audit events, development-module behavior, settings, logout, Communication Board, and Notice behavior remain intact.
- No database, RLS, Map runtime, Data Entry, Admin, or Research Library internal-page behavior changed.

### Verification

- Added source-level presentation regression tests that avoid pixel-value assertions.
- Final acceptance requires the PR head to pass Typecheck, Lint, Test, and Production Build before merge.
- Browser QA is required at the requested desktop and mobile viewports when an authenticated preview is available.

### Follow-up

- Keep future Home changes focused on observed workflow friction; do not reintroduce decorative English labels, badge-driven hierarchy, or marketing-style hero treatment.

'''
              head, sep, tail = text.partition(anchor)
              if not sep:
                  raise SystemExit('CHANGELOG anchor not found')
              path.write_text(head + anchor + entry + anchor + tail)
          PY
          git rm .github/workflows/home-changelog-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: record Home visual hierarchy rebuild [skip ci]"
          git push origin HEAD:fix/home-visual-rebuild-zh
