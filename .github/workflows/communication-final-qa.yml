name: Communication Final QA

on:
  push:
    branches:
      - "fix/home-visual-rebuild-zh"
    paths:
      - ".github/workflows/communication-final-qa.yml"

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-visual-rebuild-zh
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare final changelog tree
        env:
          ENTRY_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text()
          title = '## 2026-08-25 — Home collaboration information-layer final QA'
          if title not in text:
              entry = base64.b64decode(os.environ['ENTRY_B64']).decode()
              marker = '---\n\n'
              index = text.find(marker)
              if index == -1:
                  raise SystemExit('CHANGELOG entry marker not found')
              insert_at = index + len(marker)
              path.write_text(text[:insert_at] + entry + text[insert_at:])
          PY
          rm .github/workflows/communication-final-qa.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Production Build
        run: npm run build

      - name: Commit verified final tree
        run: |
          git config user.name "ronyu870-collab"
          git config user.email "ronyu870@gmail.com"
          git add CHANGELOG.md .github/workflows/communication-final-qa.yml
          git commit -m "chore: record Home collaboration final QA"
          git push origin HEAD:fix/home-visual-rebuild-zh
