name: Data Entry Finalize

on:
  push:
    branches:
      - feat/data-entry-2-0
    paths:
      - .github/workflows/data-entry-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/data-entry-2-0
      - name: Preserve audited Data Entry contracts
        shell: python
        run: |
          from pathlib import Path

          lease = Path('src/app/lease-submission/components/LeaseTransactionWorkspaceForm.tsx')
          text = lease.read_text()

          text = text.replace(
              "  const [industryMap, setIndustryMap] = React.useState<Record<string, string[]>>({});\n",
              "  const [industryMap, setIndustryMap] = React.useState<Record<string, string[]>>({});\n  const [isCustomSubIndustry, setIsCustomSubIndustry] = React.useState(false);\n  const [customSubIndustryText, setCustomSubIndustryText] = React.useState('');\n",
          )
          text = text.replace(
              "  const [forceSubmit, setForceSubmit] = React.useState(false);\n",
              "  const [forceSubmit, setForceSubmit] = React.useState(false);\n  const forceSubmitRef = React.useRef(false);\n",
          )
          text = text.replace(
              "    setForceSubmit(false);\n    setShowDuplicate(false);\n",
              "    setForceSubmit(false);\n    forceSubmitRef.current = false;\n    setShowDuplicate(false);\n",
          )
          text = text.replace(
              "      reset(mapLeaseRecordToFormDefaults(initialData));\n",
              "      reset(mapLeaseRecordToFormDefaults(initialData));\n      const standardSubIndustries = initialData.industry ? industryMap[initialData.industry] ?? [] : [];\n      const customSubIndustry = Boolean(initialData.sub_industry && standardSubIndustries.length > 0 && !standardSubIndustries.includes(initialData.sub_industry));\n      setIsCustomSubIndustry(customSubIndustry);\n      setCustomSubIndustryText(customSubIndustry ? initialData.sub_industry || '' : '');\n",
          )
          text = text.replace(
              "      setBehalfUserId('');\n    }\n  }, [isOpen, mode, initialData, reset, buildings]);\n",
              "      setBehalfUserId('');\n      setIsCustomSubIndustry(false);\n      setCustomSubIndustryText('');\n    }\n  }, [isOpen, mode, initialData, reset, buildings, industryMap]);\n",
          )
          text = text.replace(
              "    if (!forceSubmit && await findDuplicates(data)) return;\n",
              "    if (!forceSubmitRef.current && await findDuplicates(data)) return;\n",
          )
          text = text.replace(
              "      sub_industry: data.sub_industry?.trim() || null,\n",
              "      sub_industry: isCustomSubIndustry && customSubIndustryText.trim() ? customSubIndustryText.trim() : (data.sub_industry?.trim() || null),\n",
          )
          text = text.replace(
              "      setForceSubmit(false);\n      onSubmitSuccess();\n",
              "      setForceSubmit(false);\n      forceSubmitRef.current = false;\n      onSubmitSuccess();\n",
          )
          text = text.replace(
              "    setForceSubmit(false);\n    setBuildingLocked(false);\n",
              "    setForceSubmit(false);\n    forceSubmitRef.current = false;\n    setIsCustomSubIndustry(false);\n    setCustomSubIndustryText('');\n    setBuildingLocked(false);\n",
          )
          text = text.replace(
              "              <div><label className=\"mb-1 block text-[11px] font-medium text-zinc-600\">所属子行业 *</label><SearchableSelect value={watch('sub_industry') || ''} onChange={(value) => setValue('sub_industry', value, { shouldDirty: true, shouldValidate: true })} options={subIndustryOptions} placeholder={selectedIndustry ? '请选择' : '先选择行业'} disabled={!selectedIndustry} />{errors.sub_industry && <p className=\"mt-1 text-[10px] text-rose-600\">{errors.sub_industry.message}</p>}</div>\n",
              "              <div><label className=\"mb-1 block text-[11px] font-medium text-zinc-600\">所属子行业 *</label><SearchableSelect value={isCustomSubIndustry ? '其他' : (watch('sub_industry') || '')} onChange={(value) => { setValue('sub_industry', value, { shouldDirty: true, shouldValidate: true }); setIsCustomSubIndustry(value === '其他'); if (value !== '其他') setCustomSubIndustryText(''); }} options={subIndustryOptions} placeholder={selectedIndustry ? '请选择' : '先选择行业'} disabled={!selectedIndustry} />{isCustomSubIndustry && <input type=\"text\" value={customSubIndustryText} onChange={(event) => setCustomSubIndustryText(event.target.value)} placeholder=\"填写具体子行业（可留空）\" className=\"mt-1.5 min-h-9 w-full rounded-md border border-zinc-300 px-2.5 text-xs outline-none focus:border-[#003e7e]\" />}{errors.sub_industry && <p className=\"mt-1 text-[10px] text-rose-600\">{errors.sub_industry.message}</p>}</div>\n",
          )
          text = text.replace(
              "      {showDuplicate && <DuplicateDialog duplicates={duplicates} onCancel={() => { setShowDuplicate(false); setForceSubmit(false); setSubmitState('idle'); }} onConfirm={() => { setShowDuplicate(false); setForceSubmit(true); const values = getValues(); window.setTimeout(() => { void submitValidated(values); }, 0); }} />}\n",
              "      {showDuplicate && <DuplicateDialog duplicates={duplicates} onCancel={() => { setShowDuplicate(false); setForceSubmit(false); forceSubmitRef.current = false; setSubmitState('idle'); }} onConfirm={() => { setShowDuplicate(false); setForceSubmit(true); forceSubmitRef.current = true; const values = getValues(); window.setTimeout(() => { void submitValidated(values); }, 0); }} />}\n",
          )
          lease.write_text(text)

          quarterly = Path('src/app/update/components/QuarterlyUpdateWorkspace.tsx')
          q = quarterly.read_text()
          q = q.replace(
              "                  const lastVacancy = safeNum(rawVacancy);\n",
              "                  const lastVacancyPercent = rawVacancy === '' ? null : (String(rawVacancy).includes('%') ? parseFloat(String(rawVacancy)) : (safeNum(rawVacancy) > 1 ? safeNum(rawVacancy) : safeNum(rawVacancy) * 100));\n",
          )
          q = q.replace(
              "                      <td className=\"bg-slate-50/70 px-2 py-1.5 text-right tabular-nums text-zinc-500\">{rawVacancy !== '' ? `${(lastVacancy * 100).toFixed(1)}%` : '-'}</td>\n",
              "                      <td className=\"bg-slate-50/70 px-2 py-1.5 text-right tabular-nums text-zinc-500\">{lastVacancyPercent !== null && Number.isFinite(lastVacancyPercent) ? `${lastVacancyPercent.toFixed(1)}%` : '-'}</td>\n",
          )
          q = q.replace(
              "    if (index >= 0 && cells[index + 1]) {\n      event.preventDefault();\n      cells[index + 1].focus();\n      if (cells[index + 1] instanceof HTMLInputElement) cells[index + 1].select();\n    }\n",
              "    const nextCell = index >= 0 ? cells[index + 1] : undefined;\n    if (nextCell) {\n      event.preventDefault();\n      nextCell.focus();\n      if (nextCell instanceof HTMLInputElement) nextCell.select();\n    }\n",
          )
          quarterly.write_text(q)

          dom_hack = Path('src/types/dom-input-select.d.ts')
          if dom_hack.exists():
              dom_hack.unlink()

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text()
          entry = '''\n---\n\n## 2026-08-25 — Data Entry 2.0 for Quarterly Update and Lease Submission\n\n### Area\nQuarterly Update / Lease Submission / shared data-entry primitives / validation / save state / responsive business workflows\n\n### What changed\n\n- Rebuilt Quarterly Update as a dense Data Entry workspace while preserving assignments, Admin preview, impersonation read-only behavior, prior-quarter metrics, future-supply assignments, 30-second cloud drafts, existing calculation formulas, force-submit semantics, submission tables, and audit logging.\n- Added persistent save-state presentation for unsaved, saving, saved, failed/retry, submitting, and submitted states; retained manual save in addition to the existing timed cloud-draft sync.\n- Organized Quarterly fields into project context, previous-quarter reference, and current-quarter entry groups; added Enter/Tab-friendly continuous entry, inline advisory validation, mobile field cards, and stable submission confirmation.\n- Rebuilt Lease Submission as a compact Broker Data Entry workspace with entity-first building selection, recent-building shortcuts, relocation/original-location handling, daily/monthly rent input, existing fuzzy-duplicate confirmation, on-behalf submission, current/previous-quarter selection, record editing, transfer, and Admin team views.\n- Preserved the existing custom sub-industry path when `其他` is selected, including existing custom values during edit.\n- Added a persistent Lease success state showing the written company, building, area, quarter, and record ID, with explicit Continue adding / Return to workspace actions.\n- Added shared `SaveStatus`, `ValidationMessage`, and `DataEntryToolbar` primitives only where both workflows use the same semantics.\n- Added regression coverage for Quarterly completeness/payload calculations, Lease existing-record mapping and period window, persistent error/retry state, and server-side authorization seams.\n\n### Why\n\nQuarterly Update and Lease Submission were functionally mature but still behaved like legacy page/form surfaces. High-frequency Broker, Research, and Admin entry needs dense navigation, visible validation near the affected field, explicit database/save state, and reliable continuation after a successful write.\n\n### Impact\n\n- No DB schema, RLS, Map architecture, MapDataStore, MapController, or Auth architecture changes.\n- Existing permissions, server-side Admin checks, record ownership checks, data fields, validation services, duplicate checking, audit calls, and submission destinations are preserved.\n- Newly surfaced Quarterly anomaly checks are warnings only; no unsupported business rule was introduced as a hard validation block.\n- Desktop remains the primary high-density experience; 390–430px layouts keep major fields and submit actions reachable without forcing the full desktop grid onto mobile.\n\n### Verification\n\n- Final acceptance requires the exact PR head to pass the permanent Verify workflow in order: Typecheck, Lint, Test, and Production Build.\n- Regression coverage includes validation, save/error retry state, existing records, calculation payloads, and authorization boundaries.\n\n### Follow-up\n\n- Continue Data Entry refinement only from observed Broker/Research usage; do not change DB schema or authorization boundaries as a UI follow-up.\n'''
          marker = '\n---\n\n## 2026-08-25 — Map final experience QA and interaction hardening'
          if 'Data Entry 2.0 for Quarterly Update and Lease Submission' not in current:
              current = current.replace(marker, entry + marker, 1)
              changelog.write_text(current)
      - name: Commit finalized contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/app/lease-submission/components/LeaseTransactionWorkspaceForm.tsx src/app/update/components/QuarterlyUpdateWorkspace.tsx src/types/dom-input-select.d.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve Data Entry 2.0 business contracts"
          git push origin HEAD:feat/data-entry-2-0
