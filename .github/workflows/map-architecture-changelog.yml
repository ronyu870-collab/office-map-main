name: One-time Map architecture changelog

on:
  push:
    branches:
      - refactor/map-architecture

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[map-changelog-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/map-architecture
          fetch-depth: 0

      - name: Update engineering changelog
        run: python3 scripts/apply-map-architecture-changelog.py

      - name: Commit changelog entry
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "[map-changelog-codemod] docs: record Map architecture split"
          git push origin HEAD:refactor/map-architecture
