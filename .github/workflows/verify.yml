name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search-focus:
    name: Search and filter focus coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the coverage contract
        run: node --test scripts/verify-search-focus-gate.mjs
      - name: Run regressions for affected entrypoints
        run: node scripts/search-focus-gate.mjs
        env:
          SEARCH_FOCUS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit coverage contract
        run: npm run audit:coverage
        env:
          AUDIT_COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Archived original ingestion regression
        run: |
          node --experimental-strip-types scripts/sales-materials/verify-local.mjs
          node --experimental-strip-types scripts/sales-materials/verify-data-only.mjs
          node --experimental-strip-types scripts/sales-materials/verify-library.mjs

      - name: Isolated quarterly SQL regressions
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/quarterly-db-tests" --no-save --ignore-scripts @electric-sql/pglite@0.3.14
          PGLITE_MODULE="$RUNNER_TEMP/quarterly-db-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/quarterly-reliability/run.mjs

      - name: Real PostgreSQL 17 concurrent quarterly regressions
        run: node supabase/tests/quarterly-reliability/concurrency.mjs
        env:
          QUARTERLY_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 lease edit and audit regressions
        run: npm run test:db:lease-audit
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 building identity rename regressions
        run: npm run test:db:building-renames
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Install isolated backup dependencies
        run: npm ci --prefix scripts/backup --ignore-scripts --no-audit --no-fund

      - name: Install isolated backup regression tools
        run: bash scripts/backup/install-ci-tools.sh server

      - name: Encrypted backup and fresh PostgreSQL 17 restore regressions
        run: |
          npm --prefix scripts/backup run test:unit
          npm --prefix scripts/backup run test:postgres
        env:
          BACKUP_TEST_PG_BIN: /usr/lib/postgresql/17/bin

      - name: Real PostgreSQL historical project material regressions
        run: |
          node supabase/tests/project-materials/run.mjs
          node --experimental-strip-types supabase/tests/material-library/run.mjs
        env:
          MATERIAL_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL audit identity regressions
        run: node supabase/tests/audit-identity/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 building photo constraints and access regressions
        run: node supabase/tests/building-photos/run.mjs
        env:
          PHOTO_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Building photo transfer safety and idempotency regressions
        run: node --test scripts/building-photos/transfer-handler.node-test.mjs

      - name: Real PostgreSQL 17 backup permission and business regressions
        shell: bash
        run: |
          # Try the upstream release first, then the publicly indexed SourceForge
          # mirror if GitHub's release CDN is unavailable (repeated HTTP 504).
          # Neither source is trusted until the pinned SHA-256 check below passes.
          postgrest_archive="$RUNNER_TEMP/postgrest-v16.5.tar.xz"
          if ! curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 90 \
            https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz \
            -o "$postgrest_archive"; then
            echo "::warning::GitHub release CDN unavailable; fetching the same pinned PostgREST v16.5 asset from the SourceForge mirror"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 90 \
              https://downloads.sourceforge.net/project/postgrest.mirror/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz \
              -o "$postgrest_archive"
          fi
          echo "5099e7ada38f9f6846cd87c14c5f158b7c165f1e9959665ad412e61f4dceba95  $RUNNER_TEMP/postgrest-v16.5.tar.xz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/permission-gateway"
          tar -xJf "$RUNNER_TEMP/postgrest-v16.5.tar.xz" -C "$RUNNER_TEMP/permission-gateway"
          POSTGREST_PATH="$RUNNER_TEMP/permission-gateway/postgrest" node supabase/tests/backup-permissions/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: PostgreSQL 17 and PostgREST memo preview regression
        run: node supabase/tests/memo-list-preview/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST display override regression
        run: node supabase/tests/display-overrides/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST lease history count regression
        run: node supabase/tests/lease-history-count/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST feedback thread regression
        run: node supabase/tests/feedback-thread/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST changelog preview regression
        run: node supabase/tests/changelog-list-preview/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST announcement preview regression
        run: node supabase/tests/notice-list-preview/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_AMAP_KEY: syntheticfixture

      - name: Browser measurement calibration and anonymous production-build regression
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/performance-browser" --no-save --ignore-scripts playwright-core@1.58.2
          node "$RUNNER_TEMP/performance-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
          export PERF_PLAYWRIGHT_MODULE="$RUNNER_TEMP/performance-browser/node_modules/playwright-core"
          export PERF_BROWSER_CHANNEL=chromium
          node scripts/performance/verify-summary.mjs
          node scripts/performance/verify-capture.mjs
          node scripts/performance/verify-api-server-timing.mjs
          node --experimental-strip-types scripts/performance/verify-auth-transitions.mjs
          node scripts/verification/verify-building-photos.mjs
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3210 > "$RUNNER_TEMP/performance-server.log" 2>&1 &
          performance_server_pid=$!
          trap 'kill "$performance_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3210/login > /dev/null; then break; fi
            sleep 1
          done
          node scripts/performance/verify-anonymous.mjs http://127.0.0.1:3210
          node scripts/performance/verify-home-cold-start.mjs http://127.0.0.1:3210
          node scripts/performance/verify-compare-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-oss-directory.mjs http://127.0.0.1:3210
          node scripts/performance/verify-map-startup-stages.mjs http://127.0.0.1:3210
          node scripts/performance/verify-audit-search.mjs http://127.0.0.1:3210
          node scripts/performance/verify-lease-workspace-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-lease-history-count.mjs http://127.0.0.1:3210
          node scripts/performance/verify-lease-team-monitor.mjs http://127.0.0.1:3210
          node scripts/performance/verify-feedback-thread.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-operator.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-database-discovery.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-debug-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-memo-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-changelog-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-notice-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-user-directory.mjs http://127.0.0.1:3210
          node scripts/performance/verify-display-overrides.mjs http://127.0.0.1:3210
          node scripts/performance/verify-quarterly-reference.mjs http://127.0.0.1:3210
          node scripts/performance/verify-proposal-read.mjs http://127.0.0.1:3210
          node scripts/verification/verify-occupier-report.mjs http://127.0.0.1:3210

      - name: Retain isolated report verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occupier-report-verification
          path: verification/occupier-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain isolated building photo verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: building-photo-verification
          path: verification/building-photos
          if-no-files-found: ignore
          retention-days: 7
