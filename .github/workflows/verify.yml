name: Verify

on:
  pull_request:
    branches:
      - main
      - codex/pitch-studio-01-foundation
      - codex/pitch-studio-02-render-engine
      - codex/pitch-studio-03-material-library
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select verification scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      quick_only: ${{ steps.scope.outputs.quick_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify safe scope selection and required-check results
        run: node --test scripts/verification/ci-scope.node-test.mjs
      - id: scope
        run: node scripts/verification/ci-scope.mjs
        env:
          CI_COMPARISON_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_QUICK_REQUESTED: ${{ startsWith(github.head_ref, 'codex/quick-') || contains(github.event.head_commit.message, '[quick]') }}

  search-focus:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Search and filter focus coverage
    runs-on: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && vars.CI_TEMP_RUNNER_BRANCH != ''
          && github.event.pull_request.head.ref == vars.CI_TEMP_RUNNER_BRANCH
          && fromJSON('["self-hosted","Linux","X64","colliers-visual-ci"]')
          || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The temporary runner already has a warm npm cache on disk.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: npm ci
      - name: Verify the coverage contract
        run: node --test scripts/verify-search-focus-gate.mjs
      - name: Run regressions for affected entrypoints
        run: node scripts/search-focus-gate.mjs
        env:
          SEARCH_FOCUS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  quick:
    name: Quick UI update
    needs: changes
    if: ${{ needs.changes.outputs.quick_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:quick
        env:
          CI_COMPARISON_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  engineering:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.quick_only != 'true' }}
    name: Engineering regressions
    runs-on: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && vars.CI_TEMP_RUNNER_BRANCH != ''
          && github.event.pull_request.head.ref == vars.CI_TEMP_RUNNER_BRANCH
          && fromJSON('["self-hosted","Linux","X64","colliers-visual-ci"]')
          || 'ubuntu-24.04' }}
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # The temporary runner already has a warm npm cache on disk.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Audit coverage contract
        run: npm run audit:coverage
        env:
          AUDIT_COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Typecheck
        run: npm run typecheck

      - name: Check schema dictionary catalog and search index
        run: node scripts/generate-schema-dictionary.mjs --check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Offline AI evaluation budget and replay boundaries
        run: npm run test:ai-eval

      - name: Archived original ingestion regression
        run: |
          node --experimental-strip-types scripts/sales-materials/verify-local.mjs
          node --experimental-strip-types scripts/sales-materials/verify-data-only.mjs
          node --experimental-strip-types scripts/sales-materials/verify-library.mjs

      - name: Isolated quarterly SQL regressions
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/quarterly-db-tests" --no-save --ignore-scripts @electric-sql/pglite@0.3.14
          PGLITE_MODULE="$RUNNER_TEMP/quarterly-db-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/quarterly-reliability/run.mjs

      - name: Real PostgreSQL 17 concurrent quarterly regressions
        run: node supabase/tests/quarterly-reliability/concurrency.mjs
        env:
          QUARTERLY_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 Pitch Studio foundation and PPTX regressions
        run: |
          node supabase/tests/pitch-studio/render.mjs
          node supabase/tests/pitch-studio/run.mjs
          node supabase/tests/pitch-studio/library-parser.mjs
          node supabase/tests/pitch-studio/library.mjs
          node supabase/tests/pitch-studio/business.mjs
        env:
          PITCH_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 lease edit and audit regressions
        run: npm run test:db:lease-audit
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 atomic lease transfer and audit regressions
        run: node supabase/tests/lease-transfer-safety/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 lease expiry review regressions
        run: node supabase/tests/lease-expiry/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 Stacking Plan role, migration and audit regressions
        run: node supabase/tests/stacking-plan/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 lease company AI regressions
        run: node supabase/tests/lease-company-ai/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 market communication and recipient authorization
        run: node supabase/tests/market-communication/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 building identity rename regressions
        run: npm run test:db:building-renames
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Install isolated backup dependencies
        run: npm ci --prefix scripts/backup --ignore-scripts --no-audit --no-fund

      - name: Install isolated backup regression tools
        run: bash scripts/backup/install-ci-tools.sh server

      - name: Encrypted backup and fresh PostgreSQL 17 restore regressions
        run: |
          npm --prefix scripts/backup run test:unit
          npm --prefix scripts/backup run test:postgres
        env:
          BACKUP_TEST_PG_BIN: /usr/lib/postgresql/17/bin

      - name: Real PostgreSQL historical project material regressions
        run: |
          node supabase/tests/project-materials/run.mjs
          node --experimental-strip-types supabase/tests/material-library/run.mjs
        env:
          MATERIAL_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL audit identity regressions
        run: node supabase/tests/audit-identity/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL Audit 2 reliability and permission regressions
        run: |
          node supabase/tests/audit-2/run.mjs
          node supabase/tests/audit-2/quarterly-performance.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL AI query audit regressions
        run: |
          node supabase/tests/ai-query-audit/run.mjs
          node supabase/tests/ai-query-intake/run.mjs
          node supabase/tests/ai-audit-console/run.mjs
          node supabase/tests/ai-admin-only/run.mjs
          node supabase/tests/ai-audit-people/run.mjs
          node supabase/tests/ai-audit-export/run.mjs
          node supabase/tests/ai-query-authority/run.mjs
          node supabase/tests/ai-query-authority/p1-periods.mjs
          node supabase/tests/ai-query-authority/ai5-quarterly.mjs
          node supabase/tests/ai-lease-research/run.mjs
          node supabase/tests/ai-business-research/run.mjs
          node supabase/tests/ai-knowledge-retrieval/run.mjs
          node supabase/tests/ai-production-enablement/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 historical industry backfill and rollback
        run: node supabase/tests/history-industry-backfill/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 building photo constraints and access regressions
        run: node supabase/tests/building-photos/run.mjs
        env:
          PHOTO_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Building photo transfer safety and idempotency regressions
        run: node --test scripts/building-photos/transfer-handler.node-test.mjs

      - name: Real PostgreSQL 17 backup permission and business regressions
        shell: bash
        run: |
          # Try the upstream release first, then the publicly indexed SourceForge
          # mirror if GitHub's release CDN is unavailable (repeated HTTP 504).
          # Neither source is trusted until the pinned SHA-256 check below passes.
          postgrest_archive="$RUNNER_TEMP/postgrest-v16.5.tar.xz"
          if ! curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 90 \
            https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz \
            -o "$postgrest_archive"; then
            echo "::warning::GitHub release CDN unavailable; fetching the same pinned PostgREST v16.5 asset from the SourceForge mirror"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 90 \
              https://downloads.sourceforge.net/project/postgrest.mirror/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz \
              -o "$postgrest_archive"
          fi
          echo "5099e7ada38f9f6846cd87c14c5f158b7c165f1e9959665ad412e61f4dceba95  $RUNNER_TEMP/postgrest-v16.5.tar.xz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/permission-gateway"
          tar -xJf "$RUNNER_TEMP/postgrest-v16.5.tar.xz" -C "$RUNNER_TEMP/permission-gateway"
          POSTGREST_PATH="$RUNNER_TEMP/permission-gateway/postgrest" node supabase/tests/backup-permissions/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: PostgreSQL 17 and PostgREST memo preview regression
        run: node supabase/tests/memo-list-preview/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST AI query audit adapters
        run: |
          node supabase/tests/ai-query-authority/gateway.mjs
          node supabase/tests/ai-query-authority/p1-gateway.mjs
          node supabase/tests/ai-query-history/gateway.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST display override regression
        run: node supabase/tests/display-overrides/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST lease history count regression
        run: node supabase/tests/lease-history-count/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST feedback thread regression
        run: node supabase/tests/feedback-thread/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST changelog preview regression
        run: node supabase/tests/changelog-list-preview/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST announcement preview regression
        run: node supabase/tests/notice-list-preview/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: PostgreSQL 17 and PostgREST recommendation catalog regression
        run: node supabase/tests/intelligence-recommendation-catalog/run.mjs
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGREST_PATH: ${{ runner.temp }}/permission-gateway/postgrest

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_AMAP_KEY: syntheticfixture

      - name: Browser measurement calibration and anonymous production-build regression
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/performance-browser" --no-save --ignore-scripts playwright-core@1.58.2
          node "$RUNNER_TEMP/performance-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
          export PERF_PLAYWRIGHT_MODULE="$RUNNER_TEMP/performance-browser/node_modules/playwright-core"
          export PERF_BROWSER_CHANNEL=chromium
          node --test scripts/performance/route-callback-drain.node-test.mjs
          node scripts/performance/verify-summary.mjs
          node scripts/performance/verify-capture.mjs
          node scripts/performance/verify-api-server-timing.mjs
          node scripts/performance/verify-intelligence-pipeline.mjs
          node --experimental-strip-types scripts/performance/verify-auth-transitions.mjs
          node scripts/verification/verify-building-photos.mjs
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3210 > "$RUNNER_TEMP/performance-server.log" 2>&1 &
          performance_server_pid=$!
          trap 'kill "$performance_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3210/login > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verification/ui-craft-browser.mjs http://127.0.0.1:3210
          node scripts/performance/verify-anonymous.mjs http://127.0.0.1:3210
          node scripts/performance/verify-home-cold-start.mjs http://127.0.0.1:3210
          node scripts/verification/home-entry-browser.mjs after http://127.0.0.1:3210
          HOME_QUERY_P2_BUILD_MODE=production HOME_QUERY_P2_EVIDENCE_DIR="$RUNNER_TEMP/colliers-ai-experience-p2" node scripts/verification/home-query-experience-p2-browser.mjs after http://127.0.0.1:3210
          HOME_QUERY_MENU_ONLY=1 HOME_QUERY_P2_BUILD_MODE=production HOME_QUERY_P2_EVIDENCE_DIR="$RUNNER_TEMP/colliers-ai-menus" node scripts/verification/home-query-experience-p2-browser.mjs after http://127.0.0.1:3210
          for zoom in 1.25 2; do
            HOME_QUERY_MENU_ONLY=1 HOME_QUERY_P2_WIDTHS=1280 HOME_QUERY_P2_BROWSER_ZOOM="$zoom" HOME_QUERY_P2_BUILD_MODE=production HOME_QUERY_P2_EVIDENCE_DIR="$RUNNER_TEMP/colliers-ai-menus/zoom-$zoom" node scripts/verification/home-query-experience-p2-browser.mjs after http://127.0.0.1:3210
          done
          node scripts/performance/verify-admin-ledger-first-open.mjs http://127.0.0.1:3210
          node scripts/performance/verify-home-cold-start.mjs --prefetch-policy http://127.0.0.1:3210
          node scripts/performance/verify-compare-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-oss-directory.mjs http://127.0.0.1:3210
          node scripts/performance/verify-oss-upload-queue.mjs http://127.0.0.1:3210
          node scripts/performance/verify-map-startup-stages.mjs http://127.0.0.1:3210
          node scripts/verification/verify-map-workspace.mjs http://127.0.0.1:3210
          node scripts/verification/verify-map-continuity.mjs http://127.0.0.1:3210
          node scripts/performance/verify-frozen-meeting-map.mjs http://127.0.0.1:3210
          node scripts/performance/verify-map-pdf-preview.mjs http://127.0.0.1:3210
          node scripts/performance/verify-audit-lifecycle.mjs
          node scripts/performance/verify-reading-downloads.mjs
          node scripts/performance/verify-audit-browser-budget.mjs
          node scripts/performance/verify-audit-search.mjs http://127.0.0.1:3210
          node scripts/performance/verify-lease-workspace-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-related-lease-states.mjs http://127.0.0.1:3210
          node scripts/performance/verify-lease-history-count.mjs http://127.0.0.1:3210
          node scripts/verification/verify-broker-workflows.mjs http://127.0.0.1:3210
          node scripts/performance/verify-lease-team-monitor.mjs http://127.0.0.1:3210
          node scripts/performance/verify-feedback-thread.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-operator.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-database-discovery.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-debug-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-memo-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-changelog-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-notice-read.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-schema-dictionary.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-submission-progress.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-impersonation.mjs http://127.0.0.1:3210
          node scripts/performance/verify-admin-user-directory.mjs http://127.0.0.1:3210
          node scripts/performance/verify-display-overrides.mjs http://127.0.0.1:3210
          node scripts/performance/verify-quarterly-reference.mjs http://127.0.0.1:3210
          node scripts/performance/verify-proposal-read.mjs http://127.0.0.1:3210
          node scripts/verification/verify-occupier-report.mjs http://127.0.0.1:3210
          node scripts/verification/verify-lease-expiry.mjs http://127.0.0.1:3210
          node scripts/verification/lease-expiry-timeline-browser.mjs http://127.0.0.1:3210

      - name: Retain Audit 2 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-2-verification
          path: verification/audit-2
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain homepage browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-entry-verification
          path: |
            docs/verification/home-ai-entry/after-*.png
            docs/verification/home-ai-entry/after-browser.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain Colliers AI P2 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colliers-ai-experience-p2-verification
          path: |
            ${{ runner.temp }}/colliers-ai-experience-p2
            ${{ runner.temp }}/colliers-ai-menus
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain isolated report verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occupier-report-verification
          path: verification/occupier-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain isolated building photo verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: building-photo-verification
          path: verification/building-photos
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain AI query and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-query-audit-verification
          path: |
            verification/ai-query-intake/results.json
            verification/ai-query-p1/results.json
            verification/ai-query-p1/gateway-results.json
            verification/ai-audit-console/results.json
            verification/ai-admin-only/results.json
            verification/ai-audit-people/results.json
            verification/ai-audit-export/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain isolated lease expiry review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lease-expiry-review-verification
          path: |
            verification/lease-expiry
            verification/lease-expiry-timeline
          if-no-files-found: ignore
          retention-days: 7

  ai-query-auth:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.quick_only != 'true' }}
    name: Real Auth trusted query HTTP integration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.95.4
      - name: Start dedicated disposable query Auth stack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ai-query-auth-integration/supabase"
          cp supabase/tests/ai-query-authority/auth-config.toml "$RUNNER_TEMP/ai-query-auth-integration/supabase/config.toml"
          supabase start --workdir "$RUNNER_TEMP/ai-query-auth-integration" -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/ai-query-auth-start.log" 2>&1
          supabase status --workdir "$RUNNER_TEMP/ai-query-auth-integration" -o json > "$RUNNER_TEMP/ai-query-auth-status.json"
          chmod 600 "$RUNNER_TEMP/ai-query-auth-status.json"
      - name: Verify real login, HTTP audit, query and revocation
        shell: bash
        run: |
          AI_QUERY_AUTH_ALLOW_LOCAL=disposable AI_QUERY_AUTH_STATUS="$RUNNER_TEMP/ai-query-auth-status.json" node scripts/verification/verify-ai-query-auth.mjs
      - name: Pitch Studio real Auth, private Storage and production HTTP round trip
        shell: bash
        run: |
          PITCH_TEST_ALLOW_LOCAL=disposable PITCH_TEST_REUSE_BUILD=true PITCH_AUTH_STATUS="$RUNNER_TEMP/ai-query-auth-status.json" node scripts/verification/verify-pitch-studio-http.mjs
      - name: Stop only the disposable query Auth stack
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/ai-query-auth-integration" --no-backup
      - name: Retain credential-free query results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-query-real-auth
          path: |
            verification/ai-query-auth/results.json
          if-no-files-found: ignore
          retention-days: 7

  lease-expiry-auth:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.quick_only != 'true' }}
    name: Real Auth lease expiry integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.95.4
      - name: Start disposable local Auth and Data API stack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/f6-auth-integration/supabase"
          cp supabase/tests/lease-expiry/auth-config.toml "$RUNNER_TEMP/f6-auth-integration/supabase/config.toml"
          supabase start --workdir "$RUNNER_TEMP/f6-auth-integration" -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/f6-auth-start.log" 2>&1
          supabase status --workdir "$RUNNER_TEMP/f6-auth-integration" -o json > "$RUNNER_TEMP/f6-auth-status.json"
          chmod 600 "$RUNNER_TEMP/f6-auth-status.json"
      - name: Real account, authorization, concurrency and revocation regressions
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/f6-browser" --no-save --ignore-scripts playwright-core@1.58.2
          node "$RUNNER_TEMP/f6-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
          F6_AUTH_TEST_ALLOW_LOCAL=disposable F6_LOCAL_SUPABASE_STATUS="$RUNNER_TEMP/f6-auth-status.json" PERF_PLAYWRIGHT_MODULE="$RUNNER_TEMP/f6-browser/node_modules/playwright-core" PERF_BROWSER_CHANNEL=chromium node scripts/verification/verify-lease-expiry-auth.mjs
      - name: Stop only the disposable F6 stack
        if: always()
        run: supabase stop --workdir "$RUNNER_TEMP/f6-auth-integration" --no-backup
      - name: Retain credential-free integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lease-expiry-real-auth
          path: |
            verification/lease-expiry-auth/results.json
            verification/lease-expiry-auth/*.png
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Typecheck, lint, test and build
    if: ${{ always() }}
    needs: [changes, search-focus, quick, engineering, ai-query-auth, lease-expiry-auth]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require every applicable engineering and Auth job
        run: node scripts/verification/ci-scope.mjs --check-results
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
