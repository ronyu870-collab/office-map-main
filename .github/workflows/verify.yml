name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit coverage contract
        run: npm run audit:coverage
        env:
          AUDIT_COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Isolated quarterly SQL regressions
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/quarterly-db-tests" --no-save --ignore-scripts @electric-sql/pglite@0.3.14
          PGLITE_MODULE="$RUNNER_TEMP/quarterly-db-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/quarterly-reliability/run.mjs

      - name: Real PostgreSQL 17 concurrent quarterly regressions
        run: node supabase/tests/quarterly-reliability/concurrency.mjs
        env:
          QUARTERLY_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 lease edit and audit regressions
        run: npm run test:db:lease-audit
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Real PostgreSQL 17 building identity rename regressions
        run: npm run test:db:building-renames
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: Production build
        run: npm run build

      - name: Real PostgreSQL 17 backup permission and business regressions
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz \
            -o "$RUNNER_TEMP/postgrest-v16.5.tar.xz"
          echo "5099e7ada38f9f6846cd87c14c5f158b7c165f1e9959665ad412e61f4dceba95  $RUNNER_TEMP/postgrest-v16.5.tar.xz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/permission-gateway"
          tar -xJf "$RUNNER_TEMP/postgrest-v16.5.tar.xz" -C "$RUNNER_TEMP/permission-gateway"
          POSTGREST_PATH="$RUNNER_TEMP/permission-gateway/postgrest" npm run test:db:backup-permissions
        env:
          LEASE_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}

