name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply one-time P0 baseline fixes
        if: ${{ hashFiles('scripts/p0-fix-verify-baseline.mjs') != '' }}
        run: node scripts/p0-fix-verify-baseline.mjs

      - name: Persist one-time P0 baseline fixes
        if: ${{ hashFiles('scripts/p0-fix-verify-baseline.mjs') != '' }}
        run: |
          if git diff --quiet; then
            echo "No baseline changes to persist"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "fix: clear historical TypeScript baseline errors"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build
