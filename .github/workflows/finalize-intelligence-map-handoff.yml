name: Finalize Intelligence map handoff

on:
  push:
    branches:
      - feature/intelligence-map-handoff

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intelligence-map-handoff
          fetch-depth: 0
      - name: Remove first-frame unfiltered map flash
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/app/map/MapClient.tsx')
          text = p.read_text(encoding='utf-8')
          old = """  const initialRenderDone = React.useRef(false);\n  const intelligenceAutoFitDoneRef = React.useRef(false);\n  const intelligenceAuditDoneRef = React.useRef(false);\n"""
          new = """  const initialRenderDone = React.useRef(false);\n  const intelligenceAutoFitDoneRef = React.useRef(false);\n  const intelligenceAuditDoneRef = React.useRef(false);\n  const [intelligenceCandidatesResolved, setIntelligenceCandidatesResolved] = React.useState(false);\n"""
          if old not in text:
              raise SystemExit('MapClient ref anchor missing')
          text = text.replace(old, new, 1)

          old = """    initialRenderDone.current = true;\n    const ctrl = controllerRef.current;\n    ctrl.clearCompetitorElements();\n    ctrl.clearDistrictBoundaries();\n    ctrl.clearSubwayElements();\n    ctrl.renderMarkers(allBuildings, 'default', districtLeedStats);\n    setFilteredBuildings(allBuildings);\n    setStats(computeStatsFromBuildings(allBuildings));\n"""
          new = """    initialRenderDone.current = true;\n    if (initialIntelligenceHandoff) return;\n    const ctrl = controllerRef.current;\n    ctrl.clearCompetitorElements();\n    ctrl.clearDistrictBoundaries();\n    ctrl.clearSubwayElements();\n    ctrl.renderMarkers(allBuildings, 'default', districtLeedStats);\n    setFilteredBuildings(allBuildings);\n    setStats(computeStatsFromBuildings(allBuildings));\n"""
          if old not in text:
              raise SystemExit('MapClient initial render anchor missing')
          text = text.replace(old, new, 1)

          old = """    setFilteredBuildings(filtered);\n\n    // 竞品分析模式下跳过地图标记渲染，避免覆盖竞品标记\n"""
          new = """    setFilteredBuildings(filtered);\n    if (initialIntelligenceHandoff && !intelligenceCandidatesResolved) {\n      setIntelligenceCandidatesResolved(true);\n    }\n\n    // 竞品分析模式下跳过地图标记渲染，避免覆盖竞品标记\n"""
          if old not in text:
              raise SystemExit('MapClient filtered state anchor missing')
          text = text.replace(old, new, 1)

          old = """          candidateCount: allBuildings.length > 0 ? filteredBuildings.length : null,\n"""
          new = """          candidateCount: intelligenceCandidatesResolved ? filteredBuildings.length : null,\n"""
          if old not in text:
              raise SystemExit('MapClient candidate count anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          t = Path('src/app/map/__tests__/intelligence-map-handoff-integration.test.ts')
          test = t.read_text(encoding='utf-8')
          old = """    expect(mapClient).toContain('intelligenceAutoFitDoneRef');\n    expect(mapClient).toContain('ctrl.fitToBuildings(filtered)');\n"""
          new = """    expect(mapClient).toContain('intelligenceAutoFitDoneRef');\n    expect(mapClient).toContain('intelligenceCandidatesResolved');\n    expect(mapClient).toContain('if (initialIntelligenceHandoff) return;');\n    expect(mapClient).toContain('ctrl.fitToBuildings(filtered)');\n"""
          if old not in test:
              raise SystemExit('integration test anchor missing')
          t.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/finalize-intelligence-map-handoff.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/map/MapClient.tsx src/app/map/__tests__/intelligence-map-handoff-integration.test.ts
          git commit -m "fix: stabilize Intelligence map first render"
          git push origin HEAD:feature/intelligence-map-handoff
