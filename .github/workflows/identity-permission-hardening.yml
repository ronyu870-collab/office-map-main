ct and latest RLS already removes viewer read access to lease transactions. This pass did not rewrite existing RLS/migration history; a live policy mutation was intentionally avoided without a reliable schema-query response.\n- **Verification:** `Typecheck → Lint → Test → Production Build` executed in this workflow before committing product changes. Browser logout/network-throttling verification still requires an authenticated reachable Preview; automated contracts cover local sign-out, durable audit enqueue and refresh-safe cache clearing, but are not reported as a real-browser pass.\n\n'''
