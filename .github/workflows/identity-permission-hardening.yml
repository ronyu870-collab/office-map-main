name: Identity Permission Hardening

on:
  push:
    branches: [fix/home-visual-rebuild-zh]
    paths: [.github/workflows/identity-permission-hardening.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-visual-rebuild-zh
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/identity_permission_hardening.py
      - run: python3 scripts/identity_route_patch.py
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Production Build
        run: npm run build
      - name: Commit verified hardening
        run: |
          git config user.name "ronyu870-collab"
          git config user.email "ronyu870@gmail.com"
          git add CHANGELOG.md src
          git commit -m "fix: harden identity permission boundaries"
          git push origin HEAD:fix/home-visual-rebuild-zh
