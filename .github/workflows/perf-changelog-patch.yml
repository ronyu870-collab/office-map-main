name: Temporary performance changelog patch

on:
  push:
    branches:
      - perf/data-2-performance-hardening

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[perf-changelog]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepend performance changelog entry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '\n\n---\n\n## 2026-08-25 — Admin / Research Library 2.0'
          entry = '''\n\n---\n\n## 2026-08-25 — Data 2.0 Performance Hardening\n\n### Area\nMap / route loading / Trend / production bundle / performance regression\n\n### What changed\n\n- Established reproducible 100/300/500-building MapDataStore and marker-construction baselines before changing runtime code.\n- Removed the duplicate first marker build previously triggered once by `MapController.initMap()` and again by the managed `MapClient` lifecycle.\n- Started the lazy Trend ECharts runtime import in parallel with the building-history query after explicit Trend intent, preserving existing stale-render race guards.\n- Moved the admin-only `BuildingMetricsEditModal` behind a client-side dynamic import so normal Map entry no longer eagerly includes that secondary editor surface.\n- Added stable source-contract regression coverage for the single initial marker owner, Trend lazy/parallel loading order, route-shell split, and admin-only chunk split.\n- Recorded measured baselines and explicit `unable to measure` browser rows in `docs/performance-baseline.md`; no wall-clock timing was added as a CI gate.\n\n### Why\n\nProfiling showed that indexed filtering was already negligible at 500 buildings, while Map entry contained duplicate marker work and Trend contained a true serial waterfall. The changes therefore target proven structural waste rather than adding speculative memoization, caches, virtualization, or database changes.\n\n### Impact\n\n- Permissions, role filtering, map/filter results, compare groups, Admin behavior, audit logging, database schema and RLS remain unchanged.\n- MapClient is now the single owner of first role-aware marker rendering.\n- Trend remains lazy relative to Map startup but no longer waits for the history request before beginning its chunk load.\n\n### Verification\n\n- Baseline GitHub Actions: Typecheck, Lint, Test (238 tests), Production Build all passed.\n- Final acceptance requires the clean post-profiling head, with temporary timing/workflow files removed, to pass the same four gates.\n\n### Follow-up\n\n- Capture real authenticated Chrome Performance/React Profiler/network traces when a production-like office-map deployment is available; do not infer AMap overlay or InfoWindow latency from fake objects.\n'''
          if '## 2026-08-25 — Data 2.0 Performance Hardening' in text:
              raise SystemExit(0)
          if marker not in text:
              raise SystemExit('changelog insertion marker not found')
          text = text.replace(marker, entry + marker, 1)
          path.write_text(text)
          PY
      - name: Commit changelog
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: add performance hardening changelog [perf-changelog]"
          git push origin HEAD:perf/data-2-performance-hardening
