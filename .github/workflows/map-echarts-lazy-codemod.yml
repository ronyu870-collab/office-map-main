name: One-time Map ECharts lazy split

on:
  push:
    branches:
      - refactor/map-architecture

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[map-echarts-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/map-architecture
          fetch-depth: 0

      - name: Apply ECharts lazy split codemod
        run: python3 scripts/apply-map-echarts-lazy.py

      - name: Commit generated split
        run: |
          if git diff --quiet -- src/services/MapController.ts; then
            echo "No ECharts codemod changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/MapController.ts
          git commit -m "[map-echarts-codemod] perf: lazy load map trend charts"
          git push origin HEAD:refactor/map-architecture
