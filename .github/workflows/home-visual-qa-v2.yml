name: Home Visual QA v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: home-visual-qa-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build runtime-only QA harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/components/home/qa src/app/qa-home tests/home-visual-qa home-visual-qa-artifacts

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/home/HomeWorkspace.tsx')
          s=p.read_text()
          s=s.replace("import { CommunicationBoard } from '@/src/components/CommunicationBoard';", "import { CommunicationBoard } from '@/src/components/home/qa/CommunicationBoardQa';")
          s=s.replace("import { NoticeBanner } from '@/src/components/NoticeBanner';", "import { NoticeBanner } from '@/src/components/home/qa/NoticeBannerQa';")
          s=s.replace("import { useAppSession } from '@/src/components/SessionProvider';", "import { useAppSession } from '@/src/components/home/qa/QaSessionProvider';")
          p.write_text(s)
          PY

          cat > src/components/home/qa/QaSessionProvider.ts <<'EOF'
          'use client';
          import * as React from 'react';
          function query(){ return typeof window==='undefined' ? new URLSearchParams() : new URLSearchParams(window.location.search); }
          function makeSession(){
            const q=query(); const requested=q.get('role')||'editor'; const role=requested==='demo'?'viewer':requested;
            const displayName=q.get('name')==='long'?'华北区办公楼研究与咨询平台主管理人测试超长姓名':requested==='admin'?'管理员测试用户':requested==='demo'?'演示账号':requested==='viewer'?'查看用户':'编辑用户';
            const email=requested==='demo'?'demo@colliers.com':`${requested}@colliers.com`;
            return {displayName,role,user:{email,app_metadata:{}},session:{}};
          }
          export function useAppSession(){
            const q=query(); const transition=q.get('session')==='transition';
            const [loaded,setLoaded]=React.useState(!transition && q.get('session')!=='loading');
            React.useEffect(()=>{ if(transition){ const id=setTimeout(()=>setLoaded(true),500); return()=>clearTimeout(id); } },[transition]);
            if(!loaded) return {session:null,status:'loading' as const,refreshSession:async()=>null};
            const session=makeSession(); return {session,status:'authenticated' as const,refreshSession:async()=>session};
          }
          EOF

          cat > src/components/home/qa/NoticeBannerQa.tsx <<'EOF'
          'use client';
          import * as React from 'react';
          type N={id:number;content:string;updated_at:string};
          function mode(){return new URLSearchParams(window.location.search).get('notice')||'one'}
          function rows():N[]{const m=mode(), now=new Date().toISOString(); if(m==='empty'||m==='error')return[]; if(m==='many')return Array.from({length:6},(_,i)=>({id:i+1,updated_at:now,content:`第 ${i+1} 条系统公告：本周办公楼市场数据库例行维护与数据核验安排。`})); if(m==='long')return[{id:1,updated_at:now,content:'超长公告用于验证窄屏换行：HTTPS://INTERNAL-COLLIERS-DATA-PLATFORM-VERY-LONG-UNBROKEN-REFERENCE-ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'}]; return[{id:1,updated_at:now,content:'系统公告：请在本周五前完成季度数据核验。'}]}
          export function NoticeBanner(){
            const [data,setData]=React.useState<N[]|null>(null); const [expanded,setExpanded]=React.useState(false); const m=typeof window==='undefined'?'one':mode();
            React.useEffect(()=>{const id=setTimeout(()=>setData(rows()),m==='delayempty'?500:80);return()=>clearTimeout(id)},[m]);
            if(data===null)return <div data-qa="notice-loading" className="h-12 animate-pulse border-b border-[var(--cd-color-border)] bg-[var(--cd-color-surface-alt)]"/>;
            if(m==='error')return <section className="border-b border-[var(--cd-color-border)] bg-[var(--cd-color-surface)] px-3.5 py-3"><div className="flex items-center justify-between gap-3"><div><div className="text-[13px] font-medium">系统公告</div><p className="mt-1 text-xs text-[var(--cd-color-text-muted)]">公告暂时无法加载</p></div><button className="min-h-9 px-2.5 text-xs text-[var(--cd-color-brand)]">重试</button></div></section>;
            if(data.length===0)return null;
            const visible=expanded?data:data.slice(0,3);
            return <section className="border-b border-[var(--cd-color-border)] bg-[var(--cd-color-surface)] px-3.5 py-3"><div className="mb-2 text-[13px] font-medium">系统公告</div><div className="space-y-2">{visible.map(n=><div key={n.id} className="grid grid-cols-[52px_minmax(0,1fr)] gap-2.5 text-[13px] leading-5"><time className="text-xs text-[var(--cd-color-text-muted)]">8/25</time><p className="break-words text-[var(--cd-color-text-secondary)] [overflow-wrap:anywhere]">{n.content}</p></div>)}</div>{data.length>3?<button onClick={()=>setExpanded(v=>!v)} className="mt-2.5 min-h-8 px-1.5 text-xs text-[var(--cd-color-brand)]">{expanded?'收起公告':`查看全部 ${data.length} 条公告`}</button>:null}</section>;
          }
          EOF

          cat > src/components/home/qa/CommunicationBoardQa.tsx <<'EOF'
          'use client';
          import * as React from 'react'; import {Maximize2,Minimize2} from 'lucide-react';
          type M={id:number;user_email:string;user_name:string;content:string;created_at:string};
          function mode(){return new URLSearchParams(window.location.search).get('comm')||'some'}
          function rows():M[]{const m=mode(),now=Date.now(); if(m==='empty'||m==='error'||m==='loading')return[]; const base=[{id:1,user_email:'a@c.com',user_name:'研究部',content:'本周新增供应数据已更新。',created_at:new Date(now-180000).toISOString()},{id:2,user_email:'b@c.com',user_name:'办公楼部',content:'国贸区域新增成交一笔，已提交复核。',created_at:new Date(now-120000).toISOString()},{id:3,user_email:'editor@colliers.com',user_name:'编辑用户',content:'季度租金数据已完成第一轮检查。',created_at:new Date(now-60000).toISOString()},{id:4,user_email:'r@c.com',user_name:'研究部',content:'市场报告已上传至研究资料库。',created_at:new Date(now).toISOString()}]; if(m==='long')base[0].content='长消息用于验证换行。HTTPS://VERY-LONG-UNBROKEN-MARKET-MESSAGE-ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; return base;}
          export function CommunicationBoard(){const m=typeof window==='undefined'?'some':mode(); const [loading,setLoading]=React.useState(true); const [fullscreen,setFullscreen]=React.useState(false); React.useEffect(()=>{if(m==='loading')return;const id=setTimeout(()=>setLoading(false),80);return()=>clearTimeout(id)},[m]); const data=rows(); const visible=fullscreen?data:data.slice(-4); const body=<><div className="flex min-h-10 items-center justify-between border-b border-[var(--cd-color-border)] px-3.5 py-2"><div><h2 id={fullscreen?'communication-dialog-title':undefined} className="text-[13px] font-medium">市场交流</h2>{fullscreen?<div className="text-[11px] text-[var(--cd-color-text-muted)]">最近 50 条</div>:null}</div><button onClick={()=>setFullscreen(v=>!v)} aria-label={fullscreen?'退出市场交流':'打开市场交流（最近 50 条）'} className="inline-flex min-h-9 items-center gap-1.5 px-2 text-xs text-[var(--cd-color-text-muted)]">{fullscreen?<Minimize2 size={13}/>:<Maximize2 size={13}/>}<span>{fullscreen?'退出':'查看交流'}</span></button></div><div className="min-h-0 flex-1 overflow-y-auto">{loading?<div className="px-4 py-8 text-center text-xs text-[var(--cd-color-text-muted)]">正在加载市场交流…</div>:m==='error'?<div className="px-4 py-7 text-center"><p className="text-xs">市场交流暂时无法加载</p><button className="mt-2 min-h-9 px-2.5 text-xs text-[var(--cd-color-brand)]">重试</button></div>:visible.length===0?<div className="px-4 py-8 text-center text-xs text-[var(--cd-color-text-muted)]">暂无市场交流</div>:visible.map(x=><div key={x.id} className="border-b border-[var(--cd-color-border)] px-3.5 py-3"><div className="flex justify-between gap-3"><span className="truncate text-xs font-medium">{x.user_name}</span><span className="shrink-0 text-xs text-[var(--cd-color-text-muted)]">15:30</span></div><p className="mt-1 break-words text-[13px] leading-5 [overflow-wrap:anywhere]">{x.content}</p></div>)}</div>{fullscreen?<form className="flex gap-2 border-t p-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]"><input className="min-w-0 flex-1 rounded border px-3 py-2 text-[13px]" placeholder="分享市场动态…"/><button type="button" className="min-h-10 rounded bg-[var(--cd-color-brand)] px-3.5 text-white">发送</button></form>:null}</>;
          if(fullscreen)return <div role="dialog" aria-modal="true" aria-labelledby="communication-dialog-title" className="fixed inset-0 z-[var(--cd-z-modal)] flex h-[100dvh] max-h-[100dvh] flex-col overflow-hidden bg-[var(--cd-color-surface)]">{body}</div>;
          return <section className="flex h-full flex-col overflow-hidden bg-[var(--cd-color-surface)]" aria-label="市场交流摘要">{body}</section>}
          EOF

          cat > src/app/qa-home/page.tsx <<'EOF'
          'use client';
          import {HomeWorkspace} from '@/src/components/home/HomeWorkspace';
          export default function Page(){return <HomeWorkspace/>}
          EOF

      - name: Start Next dev server
        shell: bash
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/home-qa-next.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/qa-home >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/home-qa-next.log
          exit 1

      - name: Install Playwright
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Write Playwright spec
        shell: bash
        run: |
          cat > tests/home-visual-qa/home.spec.js <<'EOF'
          const {test,expect}=require('@playwright/test'); const fs=require('node:fs'); const path=require('node:path');
          const base='http://127.0.0.1:3000/qa-home'; const out=path.join(process.cwd(),'home-visual-qa-artifacts'); fs.mkdirSync(out,{recursive:true});
          const sizes=[[1366,768],[1440,900],[1920,1080],[390,844],[430,932],[1024,768],[1280,720]];
          async function measure(page,label){const m=await page.evaluate(()=>{const R=e=>{if(!e)return null;const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};const hs=[...document.querySelectorAll('h2')];const team=hs.find(x=>x.textContent.trim()==='团队动态');return{vw:innerWidth,vh:innerHeight,scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight,map:R(document.querySelector('a[href="/map"]')),team:R(team),aside:R(document.querySelector('aside[aria-label="团队动态"]')),user:R(document.querySelector('button[aria-label="用户菜单"]')),product:R([...document.querySelectorAll('div')].find(x=>x.textContent.trim()==='北京办公楼市场数据平台'))}}); fs.appendFileSync(path.join(out,'metrics.jsonl'),JSON.stringify({label,...m})+'\n');return m}
          for(const [w,h] of sizes)test(`core ${w}x${h}`,async({page})=>{await page.setViewportSize({width:w,height:h});await page.goto(`${base}?role=editor&notice=one&comm=some`);await page.waitForTimeout(250);await expect(page.getByRole('heading',{name:'北京办公楼市场地图'})).toBeVisible();const m=await measure(page,`${w}x${h}`);expect(m.scrollWidth).toBeLessThanOrEqual(w);expect(m.map.height).toBeGreaterThanOrEqual(100);if(w>=1024)expect(Math.abs(m.map.y-m.team.y)).toBeLessThanOrEqual(4);await page.screenshot({path:path.join(out,`core-${w}x${h}.png`),fullPage:true})});
          test('mobile long content interactions',async({page})=>{await page.setViewportSize({width:390,height:844});await page.goto(`${base}?role=editor&name=long&notice=many&comm=long`);await page.waitForTimeout(250);await page.getByRole('button',{name:'用户菜单'}).click();await expect(page.getByRole('menu')).toBeVisible();await page.screenshot({path:path.join(out,'mobile-menu.png'),fullPage:true});await page.keyboard.press('Escape');await page.getByRole('button',{name:/查看全部 6 条公告/}).click();expect(await page.evaluate(()=>document.documentElement.scrollWidth)).toBeLessThanOrEqual(390);await page.screenshot({path:path.join(out,'mobile-notices-expanded.png'),fullPage:true});await page.getByRole('button',{name:/打开市场交流/}).click();const box=await page.getByRole('dialog').boundingBox();expect(Math.round(box.height)).toBe(844);await page.screenshot({path:path.join(out,'mobile-communication.png'),fullPage:true});await page.keyboard.press('Escape')});
          test('admin long name',async({page})=>{await page.setViewportSize({width:1440,height:900});await page.goto(`${base}?role=admin&name=long&notice=one&comm=some`);await page.waitForTimeout(200);await page.getByRole('button',{name:'用户菜单'}).click();await expect(page.getByRole('menuitem',{name:/系统管理/})).toBeVisible();expect(await page.evaluate(()=>document.documentElement.scrollWidth)).toBeLessThanOrEqual(1440);await page.screenshot({path:path.join(out,'admin-long-name.png'),fullPage:true})});
          test('viewer empty',async({page})=>{await page.setViewportSize({width:430,height:932});await page.goto(`${base}?role=viewer&notice=empty&comm=empty`);await page.waitForTimeout(200);await expect(page.getByRole('link',{name:/租赁成交填报 - 当前角色无权访问/})).toHaveAttribute('aria-disabled','true');await expect(page.getByText('暂无市场交流')).toBeVisible();await page.screenshot({path:path.join(out,'viewer-empty.png'),fullPage:true})});
          test('error state',async({page})=>{await page.setViewportSize({width:430,height:932});await page.goto(`${base}?role=editor&notice=error&comm=error`);await page.waitForTimeout(200);await expect(page.getByText('公告暂时无法加载')).toBeVisible();await expect(page.getByText('市场交流暂时无法加载')).toBeVisible();expect(await page.evaluate(()=>document.documentElement.scrollWidth)).toBeLessThanOrEqual(430);await page.screenshot({path:path.join(out,'errors.png'),fullPage:true})});
          test('demo menu',async({page})=>{await page.setViewportSize({width:1440,height:900});await page.goto(`${base}?role=demo&notice=one&comm=some`);await page.waitForTimeout(200);await page.getByRole('button',{name:'用户菜单'}).click();await expect(page.getByRole('menuitem',{name:/系统管理/})).toBeVisible();await page.screenshot({path:path.join(out,'demo-menu.png'),fullPage:true})});
          test('session loading to loaded',async({page})=>{await page.setViewportSize({width:1440,height:900});await page.goto(`${base}?session=transition&role=editor&notice=one&comm=some`);await page.waitForTimeout(100);const before=await measure(page,'loading-before');await page.screenshot({path:path.join(out,'loading-before.png'),fullPage:true});await page.waitForTimeout(650);const after=await measure(page,'loading-after');await expect(page.getByRole('heading',{name:'北京办公楼市场地图'})).toBeVisible();fs.writeFileSync(path.join(out,'loading-shift.json'),JSON.stringify({before,after},null,2));await page.screenshot({path:path.join(out,'loading-after.png'),fullPage:true})});
          EOF

      - name: Run browser QA
        run: npx --yes -p @playwright/test@1.55.0 playwright test tests/home-visual-qa/home.spec.js --reporter=line --workers=1

      - name: Save server log
        if: always()
        run: cp /tmp/home-qa-next.log home-visual-qa-artifacts/next.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-visual-qa-v2
          path: home-visual-qa-artifacts
          if-no-files-found: warn
