name: Prepend Intelligence shortlist changelog

on:
  push:
    branches:
      - feature/intelligence-recommended-shortlist
    paths:
      - .github/workflows/prepend-intelligence-shortlist-changelog.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intelligence-recommended-shortlist
          fetch-depth: 0
      - name: Prepend changelog and remove helper
        shell: python
        run: |
          from pathlib import Path
          path = Path('CHANGELOG.md')
          current = path.read_text(encoding='utf-8')
          entry = '''## 2026-09-12 — Intelligence recommendation-first shortlist\n\n### Area\nIntelligence / DeepSeek requirement understanding / real-data building retrieval / recommendation ranking / Map / Proposal\n\n### Changed\n- Reframed Intelligence from a natural-language filter assistant into an AI site-selection advisor: one client requirement now returns a ranked building shortlist directly.\n- Split demand semantics into hard filters, ranking preferences, explicit system assumptions, and conditions requiring Broker verification.\n- Treats phrases such as “优先甲级” as a ranking preference rather than silently filtering out non-A-grade alternatives; explicit phrases such as “只考虑甲级” remain hard constraints.\n- When the client gives a rent ceiling without naming the rent basis, the recommendation stage explicitly assumes the platform's net-effective-rent basis instead of blocking the workflow; the assumption is shown to the Broker.\n- Added deterministic recommendation ranking from real `buildings`, latest `building_metrics`, and `building_brochure_data`, with explainable recommendation reasons and data-completeness metadata.\n- Area and move-in timing remain verification-required while real-time unit availability is absent; standard-floor area and quarterly vacancy are never represented as live availability.\n- Map is now a downstream spatial-review action rather than the place where the Broker must manually discover recommendations.\n- Top five real recommended building IDs can seed the existing session-scoped Proposal Builder in one click.\n\n### Verification\n- Added business-semantics tests for grade preference vs hard constraint, default net-effective-rent assumption, real hard-budget filtering, and availability disclaimers.\n- Added a product-contract test that keeps direct recommendation as the primary Intelligence flow and prevents regression to the parser-first UI.\n\n'''
          if '## 2026-09-12 — Intelligence recommendation-first shortlist' not in current:
              path.write_text(entry + current, encoding='utf-8')
          Path('.github/workflows/prepend-intelligence-shortlist-changelog.yml').unlink()
      - name: Commit durable changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/prepend-intelligence-shortlist-changelog.yml
          git commit -m "chore: document Intelligence recommendation-first workflow"
          git push origin HEAD:feature/intelligence-recommended-shortlist
