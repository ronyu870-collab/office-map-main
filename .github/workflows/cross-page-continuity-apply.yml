name: Cross-page continuity apply

on:
  push:
    branches:
      - fix/home-visual-rebuild-zh

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/home-visual-rebuild-zh
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize temporary changelog text
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('scripts/apply-cross-page-continuity.mjs')
          text = target.read_text()
          text = text.replace('\\\\`cross-page-product-continuity.test.ts\\\\`', 'cross-page-product-continuity.test.ts')
          target.write_text(text)
          PY

      - name: Apply continuity patch
        run: node scripts/apply-cross-page-continuity.mjs

      - name: Align intentional presentation test contracts
        run: node scripts/update-continuity-test-contracts.mjs

      - name: Remove temporary patch runners and workflow
        run: |
          rm scripts/apply-cross-page-continuity.mjs
          rm scripts/update-continuity-test-contracts.mjs
          rm .github/workflows/cross-page-continuity-apply.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Commit verified continuity fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align cross-page product continuity"
          git push origin HEAD:fix/home-visual-rebuild-zh
