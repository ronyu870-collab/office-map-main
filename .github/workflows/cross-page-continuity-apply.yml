name: Cross-page continuity apply

on:
  push:
    branches:
      - fix/home-visual-rebuild-zh

permissions:
  contents: write

concurrency:
  group: cross-page-continuity-apply
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: ${{ github.event.head_commit.message == 'chore: run cross-page continuity patch and verification' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/home-visual-rebuild-zh
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply continuity patch
        run: node scripts/apply-cross-page-continuity.mjs

      - name: Remove temporary patch runner and workflow
        run: |
          rm scripts/apply-cross-page-continuity.mjs
          rm .github/workflows/cross-page-continuity-apply.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Commit verified continuity fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align cross-page product continuity"
          git push origin HEAD:fix/home-visual-rebuild-zh
