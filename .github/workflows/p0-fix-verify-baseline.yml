name: P0 Fix Verify Baseline

on:
  push:
    branches:
      - refactor/p0-verify-baseline

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/p0-verify-baseline
          fetch-depth: 0

      - name: Apply deterministic fixes
        run: node scripts/p0-fix-verify-baseline.mjs

      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: clear historical TypeScript baseline errors"
          git push origin HEAD:refactor/p0-verify-baseline
