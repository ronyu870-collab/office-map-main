name: Home Visual QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: home-visual-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  home-visual-qa:
    name: Browser QA for Home
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create runtime-only Home QA harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/components/home/qa src/app/__qa_home__ tests/home-visual-qa

          cp src/components/home/HomeWorkspace.tsx src/components/home/qa/HomeWorkspaceQa.tsx
          cp src/components/NoticeBanner.tsx src/components/home/qa/NoticeBannerQa.tsx
          cp src/components/CommunicationBoard.tsx src/components/home/qa/CommunicationBoardQa.tsx

          python3 - <<'PY'
          from pathlib import Path

          home = Path('src/components/home/qa/HomeWorkspaceQa.tsx')
          text = home.read_text()
          text = text.replace("import { CommunicationBoard } from '@/src/components/CommunicationBoard';", "import { CommunicationBoard } from './CommunicationBoardQa';")
          text = text.replace("import { NoticeBanner } from '@/src/components/NoticeBanner';", "import { NoticeBanner } from './NoticeBannerQa';")
          text = text.replace("import { useAppSession } from '@/src/components/SessionProvider';", "import { useAppSession } from './QaSessionProvider';")
          home.write_text(text)

          notice = Path('src/components/home/qa/NoticeBannerQa.tsx')
          text = notice.read_text()
          text = text.replace("import { getAllActiveNotices } from '@/src/services/apiClient';\nimport type { NoticeRow } from '@/src/services/apiClient';", "import { getAllActiveNotices, type NoticeRow } from './qaApiClient';")
          notice.write_text(text)

          comm = Path('src/components/home/qa/CommunicationBoardQa.tsx')
          text = comm.read_text()
          text = text.replace("import { supabase } from '@/src/services/supabaseClient';", "import { supabase } from './qaSupabaseClient';")
          text = text.replace("import { MaskedText } from '@/src/components/demo';", "import { MaskedText } from './qaMaskedText';")
          comm.write_text(text)
          PY

          cat > src/components/home/qa/QaSessionProvider.ts <<'EOF'
          'use client';

          function params() {
            return typeof window === 'undefined' ? new URLSearchParams() : new URLSearchParams(window.location.search);
          }

          export function useAppSession() {
            const query = params();
            if (query.get('session') === 'loading') {
              return { session: null, status: 'loading' as const, refreshSession: async () => null };
            }

            const requestedRole = query.get('role') || 'editor';
            const role = requestedRole === 'demo' ? 'viewer' : requestedRole;
            const displayName = query.get('name') === 'long'
              ? '华北区办公楼研究与咨询平台主管理人测试超长姓名'
              : requestedRole === 'admin'
                ? '管理员测试用户'
                : requestedRole === 'demo'
                  ? '演示账号'
                  : requestedRole === 'viewer'
                    ? '查看用户'
                    : '编辑用户';
            const email = requestedRole === 'demo' ? 'demo@colliers.com' : `${requestedRole}@colliers.com`;
            const session = {
              displayName,
              role,
              user: { email, app_metadata: {} },
              session: {},
            };

            return { session, status: 'authenticated' as const, refreshSession: async () => session };
          }
          EOF

          cat > src/components/home/qa/qaApiClient.ts <<'EOF'
          export type NoticeRow = {
            id: number;
            content: string;
            updated_at: string;
          };

          function mode() {
            return typeof window === 'undefined' ? 'one' : new URLSearchParams(window.location.search).get('notice') || 'one';
          }

          const now = new Date().toISOString();

          export async function getAllActiveNotices(): Promise<NoticeRow[]> {
            const current = mode();
            if (current === 'error') throw new Error('QA notice load failure');
            if (current === 'empty') return [];
            if (current === 'many') {
              return Array.from({ length: 6 }, (_, index) => ({
                id: index + 1,
                updated_at: now,
                content: `第 ${index + 1} 条系统公告：本周办公楼市场数据库例行维护与数据核验安排。`,
              }));
            }
            if (current === 'long') {
              return [{
                id: 1,
                updated_at: now,
                content: '超长公告用于验证窄屏换行、右栏高度与无空格字符串：HTTPS://INTERNAL-COLLIERS-DATA-PLATFORM-VERY-LONG-UNBROKEN-REFERENCE-ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
              }];
            }
            return [{ id: 1, updated_at: now, content: '系统公告：请在本周五前完成季度数据核验。' }];
          }
          EOF

          cat > src/components/home/qa/qaSupabaseClient.ts <<'EOF'
          type Message = {
            id: number;
            user_email: string;
            user_name: string;
            content: string;
            created_at: string;
          };

          function mode() {
            return typeof window === 'undefined' ? 'some' : new URLSearchParams(window.location.search).get('comm') || 'some';
          }

          function data(): Message[] {
            const current = mode();
            if (current === 'empty' || current === 'error' || current === 'loading') return [];
            const now = Date.now();
            if (current === 'long') {
              return [
                { id: 1, user_email: 'analyst@colliers.com', user_name: '研究部超长姓名测试用户', created_at: new Date(now - 60000).toISOString(), content: '长消息用于验证换行与摘要高度。HTTPS://VERY-LONG-UNBROKEN-MARKET-MESSAGE-ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' },
                { id: 2, user_email: 'editor@colliers.com', user_name: '编辑用户', created_at: new Date(now).toISOString(), content: 'CBD 子市场新增一条租赁成交信息，等待复核。' },
              ];
            }
            return [
              { id: 1, user_email: 'analyst@colliers.com', user_name: '研究部', created_at: new Date(now - 180000).toISOString(), content: '本周新增供应数据已更新。' },
              { id: 2, user_email: 'broker@colliers.com', user_name: '办公楼部', created_at: new Date(now - 120000).toISOString(), content: '国贸区域新增成交一笔，已提交复核。' },
              { id: 3, user_email: 'editor@colliers.com', user_name: '编辑用户', created_at: new Date(now - 60000).toISOString(), content: '季度租金数据已完成第一轮检查。' },
              { id: 4, user_email: 'research@colliers.com', user_name: '研究部', created_at: new Date(now).toISOString(), content: '市场报告已上传至研究资料库。' },
            ];
          }

          function selectBuilder() {
            return {
              order() {
                return {
                  limit() {
                    const current = mode();
                    if (current === 'loading') return new Promise(() => {});
                    if (current === 'error') return Promise.resolve({ data: null, error: { message: 'QA communication load failure' } });
                    return Promise.resolve({ data: data(), error: null });
                  },
                };
              },
            };
          }

          export const supabase = {
            from() {
              return {
                select() { return selectBuilder(); },
                insert() { return Promise.resolve({ error: null }); },
              };
            },
            channel() {
              const channel = {
                on() { return channel; },
                subscribe() { return channel; },
              };
              return channel;
            },
            removeChannel() { return Promise.resolve(); },
          };
          EOF

          cat > src/components/home/qa/qaMaskedText.tsx <<'EOF'
          'use client';
          import * as React from 'react';
          export function MaskedText({ children }: { children: string }) {
            return <span>{children}</span>;
          }
          EOF

          cat > src/app/__qa_home__/page.tsx <<'EOF'
          'use client';
          import { HomeWorkspace } from '@/src/components/home/qa/HomeWorkspaceQa';
          export default function QaHomePage() {
            return <HomeWorkspace />;
          }
          EOF

      - name: Start QA app
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 > /tmp/home-qa-next.log 2>&1 &
          echo $! > /tmp/home-qa-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/__qa_home__ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/home-qa-next.log
          exit 1

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Create browser QA spec
        shell: bash
        run: |
          cat > tests/home-visual-qa/home.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');
          const fs = require('node:fs');
          const path = require('node:path');

          const baseURL = 'http://127.0.0.1:3000/__qa_home__';
          const previewURL = 'https://office-map-main-git-fix-home-vis-4cb771-ronyu870-9030s-projects.vercel.app';
          const outDir = path.join(process.cwd(), 'home-visual-qa-artifacts');
          fs.mkdirSync(outDir, { recursive: true });

          const viewports = [
            { name: '1366x768', width: 1366, height: 768 },
            { name: '1440x900', width: 1440, height: 900 },
            { name: '1920x1080', width: 1920, height: 1080 },
            { name: '390x844', width: 390, height: 844 },
            { name: '430x932', width: 430, height: 932 },
            { name: '1024x768', width: 1024, height: 768 },
            { name: '1280x720', width: 1280, height: 720 },
          ];

          async function metrics(page, viewportName, scenario) {
            const result = await page.evaluate(({ viewportName, scenario }) => {
              const rect = (el) => el ? (() => {
                const r = el.getBoundingClientRect();
                return { x: r.x, y: r.y, width: r.width, height: r.height, right: r.right, bottom: r.bottom };
              })() : null;
              const body = document.body;
              const header = document.querySelector('header');
              const map = document.querySelector('a[href="/map"]');
              const common = Array.from(document.querySelectorAll('h2')).find((el) => el.textContent?.trim() === '常用工作');
              const team = Array.from(document.querySelectorAll('h2')).find((el) => el.textContent?.trim() === '团队动态');
              const aside = document.querySelector('aside[aria-label="团队动态"]');
              const grid = aside?.parentElement || null;
              const product = Array.from(document.querySelectorAll('div')).find((el) => el.textContent?.trim() === '北京办公楼市场数据平台');
              const userButton = document.querySelector('button[aria-label="用户菜单"]');
              return {
                viewportName,
                scenario,
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                scrollWidth: document.documentElement.scrollWidth,
                scrollHeight: document.documentElement.scrollHeight,
                bodyScrollWidth: body.scrollWidth,
                header: rect(header),
                map: rect(map),
                commonHeading: rect(common),
                teamHeading: rect(team),
                aside: rect(aside),
                grid: rect(grid),
                product: rect(product),
                userButton: rect(userButton),
                bodyOverflowX: getComputedStyle(body).overflowX,
              };
            }, { viewportName, scenario });
            fs.appendFileSync(path.join(outDir, 'metrics.jsonl'), JSON.stringify(result) + '\n');
            return result;
          }

          for (const viewport of viewports) {
            test(`core layout ${viewport.name}`, async ({ page }) => {
              await page.setViewportSize({ width: viewport.width, height: viewport.height });
              await page.goto(`${baseURL}?role=editor&notice=one&comm=some`, { waitUntil: 'networkidle' });
              await page.waitForTimeout(450);
              await expect(page.getByRole('heading', { name: '北京办公楼市场地图' })).toBeVisible();
              const m = await metrics(page, viewport.name, 'core');
              expect(m.scrollWidth).toBeLessThanOrEqual(viewport.width);
              expect(m.map.height).toBeGreaterThanOrEqual(100);
              if (viewport.width >= 1024) {
                expect(Math.abs(m.map.y - m.teamHeading.y)).toBeLessThanOrEqual(4);
              }
              await page.screenshot({ path: path.join(outDir, `core-${viewport.name}.png`), fullPage: true });
            });
          }

          test('mobile interaction and expanded states', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(`${baseURL}?role=editor&name=long&notice=many&comm=long`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(450);
            expect(await page.evaluate(() => document.documentElement.scrollWidth)).toBeLessThanOrEqual(390);

            await page.getByRole('button', { name: '用户菜单' }).click();
            await expect(page.getByRole('menu', { name: '账户操作' })).toBeVisible();
            await page.screenshot({ path: path.join(outDir, 'mobile-user-menu-390x844.png'), fullPage: true });
            await page.keyboard.press('Escape');

            await page.getByRole('button', { name: /查看全部 6 条公告/ }).click();
            expect(await page.evaluate(() => document.documentElement.scrollWidth)).toBeLessThanOrEqual(390);
            await page.screenshot({ path: path.join(outDir, 'mobile-expanded-notices-390x844.png'), fullPage: true });

            await page.getByRole('button', { name: /打开市场交流/ }).click();
            await expect(page.getByRole('dialog')).toBeVisible();
            expect(await page.evaluate(() => document.documentElement.scrollWidth)).toBeLessThanOrEqual(390);
            const dialogBox = await page.getByRole('dialog').boundingBox();
            expect(Math.round(dialogBox.height)).toBe(844);
            await page.screenshot({ path: path.join(outDir, 'mobile-communication-fullscreen-390x844.png'), fullPage: true });
            await page.keyboard.press('Escape');
            await expect(page.getByRole('dialog')).toHaveCount(0);
          });

          test('desktop user menu long name and admin', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto(`${baseURL}?role=admin&name=long&notice=one&comm=some`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(450);
            await page.getByRole('button', { name: '用户菜单' }).click();
            await expect(page.getByRole('menuitem', { name: /系统管理/ })).toBeVisible();
            expect(await page.evaluate(() => document.documentElement.scrollWidth)).toBeLessThanOrEqual(1440);
            await page.screenshot({ path: path.join(outDir, 'desktop-admin-long-name-menu-1440x900.png'), fullPage: true });
          });

          test('viewer permission state', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto(`${baseURL}?role=viewer&notice=empty&comm=empty`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(300);
            const lease = page.getByRole('link', { name: /租赁成交填报 - 当前角色无权访问/ });
            await expect(lease).toBeVisible();
            await expect(lease).toHaveAttribute('aria-disabled', 'true');
            await page.screenshot({ path: path.join(outDir, 'viewer-no-permission-1440x900.png'), fullPage: true });
          });

          test('empty and error states', async ({ page }) => {
            await page.setViewportSize({ width: 430, height: 932 });
            await page.goto(`${baseURL}?role=editor&notice=empty&comm=empty`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(300);
            await expect(page.getByText('暂无市场交流')).toBeVisible();
            await page.screenshot({ path: path.join(outDir, 'mobile-empty-430x932.png'), fullPage: true });

            await page.goto(`${baseURL}?role=editor&notice=error&comm=error`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(300);
            await expect(page.getByText('公告暂时无法加载')).toBeVisible();
            await expect(page.getByText('市场交流暂时无法加载')).toBeVisible();
            expect(await page.evaluate(() => document.documentElement.scrollWidth)).toBeLessThanOrEqual(430);
            await page.screenshot({ path: path.join(outDir, 'mobile-errors-430x932.png'), fullPage: true });
          });

          test('session loading shell', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto(`${baseURL}?session=loading`, { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(250);
            const m = await metrics(page, '1440x900', 'session-loading');
            expect(m.scrollWidth).toBeLessThanOrEqual(1440);
            await page.screenshot({ path: path.join(outDir, 'session-loading-1440x900.png'), fullPage: true });
          });

          test('demo user menu', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto(`${baseURL}?role=demo&notice=one&comm=some`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(300);
            await page.getByRole('button', { name: '用户菜单' }).click();
            await expect(page.getByRole('menuitem', { name: /系统管理/ })).toBeVisible();
            await page.screenshot({ path: path.join(outDir, 'demo-menu-1440x900.png'), fullPage: true });
          });

          test('current Vercel Preview is reachable in a real browser', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            const response = await page.goto(previewURL, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForTimeout(1500);
            const record = {
              status: response?.status() ?? null,
              finalUrl: page.url(),
              title: await page.title(),
              text: (await page.locator('body').innerText()).slice(0, 1000),
            };
            fs.writeFileSync(path.join(outDir, 'preview-smoke.json'), JSON.stringify(record, null, 2));
            await page.screenshot({ path: path.join(outDir, 'preview-smoke-1440x900.png'), fullPage: true });
            expect(response && response.status()).toBeLessThan(500);
          });
          EOF

      - name: Run browser QA
        run: npx --yes -p @playwright/test@1.55.0 playwright test tests/home-visual-qa/home.spec.js --reporter=line --workers=1

      - name: Save Next log
        if: always()
        run: cp /tmp/home-qa-next.log home-visual-qa-artifacts/next.log || true

      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-visual-qa
          path: home-visual-qa-artifacts
          if-no-files-found: warn
